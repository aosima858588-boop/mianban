<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>每日签到 · 海豚社区</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:opsz,wght@14..32,300..700&family=Playfair+Display:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #8b5cf6;
            --primary-dark: #7c3aed;
            --primary-light: #ede9fe;
            --primary-gradient: linear-gradient(145deg, #8b5cf6, #6d4aff);
        }
        body {
            background: radial-gradient(circle at 10% 20%, #ffffff, #f5f3ff);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .card {
            background: rgba(255,255,255,0.75);
            backdrop-filter: blur(20px);
            border-radius: 40px;
            padding: 28px 24px;
            box-shadow: 0 20px 40px -15px rgba(0,0,0,0.15);
            border: 1px solid rgba(255,255,255,0.6);
            margin-bottom: 20px;
            transition: transform 0.25s ease, box-shadow 0.3s;
        }
        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 30px 45px -15px rgba(139,92,246,0.2);
        }
        .stats-row {
            display: flex;
            gap: 16px;
            margin-bottom: 30px;
        }
        .stat-item {
            flex: 1;
            background: white;
            border-radius: 30px;
            padding: 20px 8px;
            text-align: center;
            box-shadow: 0 10px 25px -8px rgba(139,92,246,0.15);
            border: 1px solid rgba(255,255,255,0.9);
            transition: transform 0.2s;
        }
        .stat-item:hover {
            transform: translateY(-3px);
        }
        .stat-label {
            font-size: 0.7rem;
            font-weight: 600;
            color: #64748b;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .stat-number {
            font-size: 2.4rem;
            font-weight: 800;
            color: var(--primary);
            line-height: 1.1;
        }
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .calendar-month {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(145deg, #0f172a, #334155);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .calendar-nav {
            display: flex;
            gap: 12px;
        }
        .nav-btn {
            width: 44px;
            height: 44px;
            border-radius: 22px;
            background: white;
            border: 1px solid #e2e8f0;
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 8px rgba(0,0,0,0.02);
        }
        .nav-btn:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            transform: scale(1.05);
        }
        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            margin-bottom: 12px;
            text-align: center;
            font-weight: 600;
            color: var(--primary);
            font-size: 0.9rem;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            margin-bottom: 30px;
        }
        .calendar-day {
            aspect-ratio: 1 / 1;
            background: white;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 500;
            color: #1e293b;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
            border: 1px solid #e2e8f0;
            transition: 0.2s;
            position: relative;
            font-size: 0.95rem;
        }
        .calendar-day.today {
            border: 2px solid var(--primary);
            font-weight: 700;
            color: var(--primary);
            background: #ffffff;
            box-shadow: 0 6px 14px rgba(139,92,246,0.2);
        }
        .calendar-day.signed {
            background: var(--primary-gradient);
            color: white;
            border: none;
            box-shadow: 0 8px 18px rgba(139,92,246,0.3);
            font-weight: 600;
        }
        .calendar-day.signed::after {
            content: '✓';
            position: absolute;
            top: -5px;
            right: -5px;
            background: #10b981;
            color: white;
            width: 20px;
            height: 20px;
            border-radius: 10px;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid white;
        }
        .calendar-day.other-month {
            opacity: 0.4;
        }
        .sign-btn {
            width: 100%;
            background: var(--primary-gradient);
            border: none;
            padding: 20px 0;
            border-radius: 60px;
            color: white;
            font-weight: 700;
            font-size: 1.5rem;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 15px 30px -8px var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 16px;
            position: relative;
            overflow: hidden;
        }
        .sign-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }
        .sign-btn:hover::before {
            left: 100%;
        }
        .sign-btn:active {
            transform: scale(0.97);
        }
        .sign-btn.disabled {
            background: #cbd5e1;
            box-shadow: none;
            pointer-events: none;
            opacity: 0.6;
        }
        .sign-tip {
            text-align: center;
            color: #64748b;
            font-size: 0.9rem;
            margin-top: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .sign-tip i {
            color: var(--primary);
        }


    </style>
</head>
<body>
    <div class="page-content">
        <div class="header">
            <a href="index.html" class="back-icon"><i class="fas fa-arrow-left"></i></a>
            <h1></h1>
        </div>


            <div class="card">
                <div class="stats-row">
                    <div class="stat-item"><div class="stat-label">累计签到</div><div class="stat-number">128</div></div>
                    <div class="stat-item"><div class="stat-label">连续签到</div><div class="stat-number">7</div></div>
                    <div class="stat-item"><div class="stat-label">今日奖励</div><div class="stat-number">+10</div></div>
                </div>

                <div class="calendar-header">
                    <span class="calendar-month" id="displayMonth">2025年3月</span>
                    <div class="calendar-nav">
                        <span class="nav-btn" id="prevMonth"><i class="fas fa-chevron-left"></i></span>
                        <span class="nav-btn" id="nextMonth"><i class="fas fa-chevron-right"></i></span>
                    </div>
                </div>

                <div class="weekdays">
                    <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
                </div>

                <div class="calendar-grid" id="calendarGrid"></div>

                <button class="sign-btn" id="signBtn">
                    <i class="fas fa-check-circle"></i> 今日签到
                </button>

                <div class="sign-tip">
                    <i class="fas fa-info-circle"></i> 签到获得10积分，连续签到额外奖励
                </div>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item"><i class="fas fa-home"></i><span>首页</span></a>
        <a href="earn.html" class="nav-item"><i class="fas fa-coins"></i><span>赚币</span></a>
        <a href="model.html" class="nav-item"><i class="fas fa-robot"></i><span>模型</span></a>
        <a href="wallet.html" class="nav-item"><i class="fas fa-wallet"></i><span>钱包</span></a>
    </nav>

    <script>
        (function() {
            // 已签到日期示例
            const signedDates = [1, 3, 5, 7, 10, 12, 15, 18, 20, 22, 25, 28];
            const currentDate = new Date(2025, 2, 15); // 演示用，固定为2025-03-15
            let displayYear = currentDate.getFullYear();
            let displayMonth = currentDate.getMonth();

            const monthNames = ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'];
            const calendarGrid = document.getElementById('calendarGrid');
            const monthDisplay = document.getElementById('displayMonth');
            const prevBtn = document.getElementById('prevMonth');
            const nextBtn = document.getElementById('nextMonth');
            const signBtn = document.getElementById('signBtn');

            let isSignedToday = false; // 模拟今日未签到

            function renderCalendar(year, month) {
                monthDisplay.textContent = year + '年' + monthNames[month];
                let firstDay = new Date(year, month, 1).getDay();
                let startOffset = firstDay === 0 ? 6 : firstDay - 1;
                let daysInMonth = new Date(year, month + 1, 0).getDate();
                let prevMonthDays = new Date(year, month, 0).getDate();
                let gridHtml = '';

                for (let i = 0; i < startOffset; i++) {
                    let day = prevMonthDays - startOffset + i + 1;
                    gridHtml += `<div class="calendar-day other-month">${day}</div>`;
                }
                for (let day = 1; day <= daysInMonth; day++) {
                    let classes = 'calendar-day';
                    if (year === currentDate.getFullYear() && month === currentDate.getMonth() && day === currentDate.getDate()) {
                        classes += ' today';
                    }
                    if (signedDates.includes(day)) {
                        classes += ' signed';
                    }
                    gridHtml += `<div class="${classes}">${day}</div>`;
                }
                let totalCells = Math.ceil((startOffset + daysInMonth) / 7) * 7;
                let nextMonthDays = totalCells - (startOffset + daysInMonth);
                for (let i = 1; i <= nextMonthDays; i++) {
                    gridHtml += `<div class="calendar-day other-month">${i}</div>`;
                }
                calendarGrid.innerHTML = gridHtml;
            }

            renderCalendar(displayYear, displayMonth);

            prevBtn.addEventListener('click', () => {
                if (displayMonth === 0) {
                    displayYear--;
                    displayMonth = 11;
                } else {
                    displayMonth--;
                }
                renderCalendar(displayYear, displayMonth);
            });

            nextBtn.addEventListener('click', () => {
                if (displayMonth === 11) {
                    displayYear++;
                    displayMonth = 0;
                } else {
                    displayMonth++;
                }
                renderCalendar(displayYear, displayMonth);
            });

            signBtn.addEventListener('click', () => {
                if (isSignedToday) {
                    alert('今日已经签到过了，明天再来吧');
                } else {
                    alert('签到成功！获得10积分');
                    isSignedToday = true;
                    signBtn.classList.add('disabled');
                    signBtn.innerHTML = '<i class="fas fa-check-circle"></i> 今日已签到';
                    // 更新今日奖励数字
                    document.querySelector('.stat-item:last-child .stat-number').textContent = '+0';
                    // 可添加今日日期签到标记，但为简化，仅演示
                }
            });

            // 底部导航高亮
            const currentPage = window.location.pathname.split('/').pop() || 'index.html';
            document.querySelectorAll('.nav-item').forEach(a => {
                if (a.getAttribute('href') === currentPage) {
                    a.classList.add('active');
                }
            });
        })();
    </script>
</body>
</html>
