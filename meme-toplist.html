<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Meme 热门榜 · 行情</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --primary: #8b5cf6;
      --primary-dark: #7c3aed;
      --primary-soft: rgba(139,92,246,0.14);
      --primary-soft2: rgba(139,92,246,0.10);

      --bg: radial-gradient(circle at 8% 10%, #ffffff 0%, #f5f3ff 52%, #ffffff 100%);
      --card: rgba(255,255,255,0.74);
      --stroke: rgba(255,255,255,0.62);
      --line: rgba(148,163,184,0.26);

      --text: #0f172a;
      --muted: #64748b;

      --shadow: 0 18px 40px -22px rgba(2,6,23,0.22);
      --shadow-hover: 0 22px 44px -22px rgba(139,92,246,0.28);

      --green: #10b981;
      --red: #ef4444;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: var(--text);
      padding: 12px 8px 90px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    .app { width: 100%; max-width: 760px; }

    /* 顶部：标题居中（去掉返回按钮） */
    .topbar{
      position: sticky;
      top: 0;
      z-index: 20;
      padding: 6px 0 10px;
      margin-bottom: 10px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }
    .topbar-inner{
      display: grid;
      grid-template-columns: 1fr auto 1fr; /* 左占位 | 中标题 | 右状态 */
      align-items: end;
      gap: 10px;
    }
    .topbar-spacer{ height: 1px; } /* 占位用 */
    .title-wrap{ text-align: center; }
    .title{
      font-size: 1.55rem;
      font-weight: 950;
      letter-spacing: -0.03em;
      line-height: 1.1;
      margin: 0;
    }
    .title-sub{
      margin-top: 6px;
      font-size: 0.82rem;
      color: var(--muted);
      font-weight: 800;
    }
    .status{
      justify-self: end;
      font-size: 0.75rem;
      color: var(--muted);
      font-weight: 900;
      white-space: nowrap;
      text-align: right;
      padding-bottom: 2px;
    }

    .card{
      background: var(--card);
      border: 1px solid var(--stroke);
      border-radius: 22px;
      box-shadow: var(--shadow);
      padding: 12px;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    /* 链按钮：未选中也有浅框 */
    .segmented{
      display: flex;
      gap: 10px;
      align-items: center;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding: 2px 0 6px;
    }
    .chain-btn{
      border: 1px solid rgba(139,92,246,0.26);
      background: rgba(255,255,255,0.62);
      color: #111827;
      padding: 10px 14px;
      border-radius: 9999px;
      font-weight: 950;
      white-space: nowrap;
      cursor: pointer;
      transition: .18s;
      box-shadow: 0 10px 18px -18px rgba(15,23,42,0.35);
    }
    .chain-btn:hover{
      border-color: rgba(139,92,246,0.46);
      box-shadow: 0 16px 22px -20px rgba(139,92,246,0.32);
    }
    .chain-btn:active{ transform: scale(0.98); }
    .chain-btn.active{
      border-color: rgba(139,92,246,0.00);
      background: linear-gradient(145deg, var(--primary), var(--primary-dark));
      color: #fff;
      box-shadow: 0 18px 24px -20px rgba(139,92,246,0.55);
    }

    /* filters */
    .filters {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }
    .select{
      background: rgba(255,255,255,0.72);
      border: 1px solid rgba(139,92,246,0.18);
      border-radius: 16px;
      padding: 11px 12px;
      display: flex;
      gap: 10px;
      align-items: center;
      transition: border-color .2s, box-shadow .2s;
    }
    .select:hover{
      border-color: rgba(139,92,246,0.38);
      box-shadow: 0 10px 18px -18px rgba(139,92,246,0.32);
    }
    .select label{
      font-size: 0.75rem;
      font-weight: 950;
      color: var(--primary-dark);
      white-space: nowrap;
      padding-right: 10px;
      border-right: 1px solid rgba(139,92,246,0.18);
    }
    .select select{
      width: 100%;
      border: none;
      background: transparent;
      outline: none;
      font-weight: 950;
      color: var(--text);
      cursor: pointer;
      font-size: 0.92rem;
    }

    /* search */
    .search{
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      background: rgba(255,255,255,0.72);
      border: 1px solid rgba(139,92,246,0.18);
      border-radius: 9999px;
      padding: 6px 6px 6px 12px;
      transition: border-color .2s, box-shadow .2s;
    }
    .search:focus-within{
      border-color: rgba(139,92,246,0.55);
      box-shadow: 0 0 0 3px rgba(139,92,246,0.14);
    }
    .search i{ color: var(--primary-dark); font-size: 0.9rem; }
    .search input{
      flex:1;
      border:none;
      outline:none;
      background:transparent;
      padding: 10px 0;
      font-weight: 900;
      color: var(--text);
      font-size: 0.95rem;
    }
    .search input::placeholder{ color: rgba(100,116,139,0.64); font-weight: 800; }
    .search-clear{
      border:none;
      background:none;
      cursor:pointer;
      display:none;
      font-size: 1rem;
      color: var(--muted);
      padding: 6px 8px;
      border-radius: 50%;
      transition: .15s;
    }
    .search-clear:hover{ background: var(--primary-soft2); color: var(--primary-dark); }
    .search button#searchBtn{
      border:none;
      cursor:pointer;
      padding: 10px 14px;
      border-radius: 9999px;
      background: linear-gradient(145deg, var(--primary), var(--primary-dark));
      color:#fff;
      font-weight: 950;
      box-shadow: 0 16px 22px -20px rgba(139,92,246,0.50);
      transition: .18s;
    }
    .search button#searchBtn:active{ transform: scale(0.98); }

    /* 列表头：成交额|市值   价格|涨幅 */
    .list-head{
      margin-top: 10px;
      display: grid;
      grid-template-columns: 1fr 150px;
      gap: 12px;
      align-items: end;
      padding: 0 10px;
      color: var(--muted);
      font-weight: 950;
      font-size: 0.78rem;
      letter-spacing: -0.01em;
    }
    .head-left{ text-align: left; }
    .head-right{ text-align: right; }
    .pipe{ opacity: .55; padding: 0 6px; }

    .list{
      margin-top: 8px;
      display:flex;
      flex-direction:column;
      gap: 8px;
    }

    .row{
      display: grid;
      grid-template-columns: 1fr 150px;
      gap: 12px;
      align-items: center;

      padding: 12px 10px;
      border-radius: 18px;
      background: rgba(255,255,255,0.82);
      border: 1px solid rgba(226,232,240,0.78);
      transition: .18s;
    }
    .row:hover{
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
      border-color: rgba(139,92,246,0.20);
    }

    .left{
      display:flex;
      align-items:center;
      gap: 10px;
      min-width:0;
    }
    .logo{
      width: 38px;
      height: 38px;
      border-radius: 9999px;
      overflow:hidden;
      background: var(--primary-soft);
      border: 1px solid rgba(139,92,246,0.18);
      display:grid;
      place-items:center;
      flex: 0 0 auto;
      font-weight: 950;
      color: var(--primary-dark);
    }
    .logo img{ width:100%; height:100%; object-fit:cover; }

    .meta{ min-width:0; }
    .sym{
      font-size: 1.06rem;
      font-weight: 950;
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow:hidden;
      text-overflow: ellipsis;
      line-height: 1.15;
    }

    /* 更像参考图：紧凑灰字 + 用 • 分隔，只显示数值 */
    .subline{
      margin-top: 6px;
      font-size: 0.78rem;
      color: rgba(100,116,139,0.86);
      font-weight: 850;
      white-space: nowrap;
      overflow:hidden;
      text-overflow: ellipsis;
    }
    .subline b{
      color: rgba(100,116,139,0.96);
      font-weight: 850;
    }

    .right{
      text-align:right;
      display:flex;
      flex-direction:column;
      align-items:flex-end;
      gap: 6px;
    }
    .price{
      font-size: 1.08rem;
      font-weight: 950;
      letter-spacing: -0.01em;
      font-variant-numeric: tabular-nums;
    }
    .chg{
      font-size: 0.86rem;
      font-weight: 950;
      font-variant-numeric: tabular-nums;
    }
    .pos{ color: var(--green); }
    .neg{ color: var(--red); }

    .skeleton { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
    .sk-row {
      height: 64px; border-radius: 18px;
      background: linear-gradient(90deg, rgba(226,232,240,0.55), rgba(226,232,240,0.35), rgba(226,232,240,0.55));
      background-size: 200% 100%; animation: shimmer 1.1s infinite;
      border: 1px solid rgba(226,232,240,0.65);
    }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

    .empty, .error {
      padding: 18px 10px;
      text-align: center;
      color: var(--muted);
      font-weight: 950;
    }
    .error { color: #b45309; }

    .bottom-nav {
      position: fixed; left: 0; bottom: 0; width: 100%;
      padding: 8px 22px;
      background: rgba(255,255,255,0.86);
      border-top: 1px solid rgba(226,232,240,0.75);
      backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
      display: flex; justify-content: space-around; z-index: 50;
    }
    .nav-item {
      text-decoration: none; color: #94A3B8;
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      padding: 6px 10px; border-radius: 16px; font-size: 11px; font-weight: 950;
      transition: .2s; position: relative;
    }
    .nav-item i { font-size: 20px; }
    .nav-item:hover { color: var(--primary); background: rgba(139,92,246,0.06); }
    .nav-item.active { color: var(--primary); }
    .nav-item.active::after {
      content: ""; position: absolute; bottom: 2px; left: 50%;
      transform: translateX(-50%); width: 4px; height: 4px;
      border-radius: 99px; background: var(--primary);
    }

    @media (max-width: 420px){
      body{ padding-left: 6px; padding-right: 6px; }
      .card{ padding: 10px; border-radius: 20px; }
      .row, .list-head{ grid-template-columns: 1fr 136px; padding-left: 8px; padding-right: 8px; }
      .price{ font-size: 1.04rem; }
      .chg{ font-size: 0.84rem; }
      .title{ font-size: 1.48rem; }
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="topbar">
      <div class="topbar-inner">
        <div class="topbar-spacer"></div>

        <div class="title-wrap">
          <h1 class="title">Meme 热门榜</h1>
          <div class="title-sub">按链筛选 · 价格与涨跌实时更新</div>
        </div>

        <div id="status" class="status"></div>
      </div>
    </div>

    <div class="card">
      <div class="segmented" role="tablist" aria-label="网络选择">
        <button class="chain-btn active" data-chain="501,56,196" type="button">全部</button>
        <button class="chain-btn" data-chain="196" type="button">X Layer</button>
        <button class="chain-btn" data-chain="56" type="button">BNB</button>
        <button class="chain-btn" data-chain="501" type="button">Solana</button>
      </div>

      <div class="filters">
        <div class="select">
          <label for="sortBy">排序</label>
          <select id="sortBy">
            <option value="2">涨幅</option>
            <option value="5" selected>成交量</option>
            <option value="6">市值</option>
          </select>
        </div>
        <div class="select">
          <label for="timeFrame">周期</label>
          <select id="timeFrame">
            <option value="1">5m</option>
            <option value="2">1h</option>
            <option value="3">4h</option>
            <option value="4" selected>24h</option>
          </select>
        </div>
      </div>

      <div class="search">
        <i class="fas fa-magnifying-glass"></i>
        <input id="searchInput" type="text" placeholder="搜索 Symbol（如 BONK）" />
        <button id="clearBtn" class="search-clear" type="button" aria-label="清除">✕</button>
        <button id="searchBtn" type="button">搜索</button>
      </div>

      <div class="list-head" aria-label="列表说明">
        <div class="head-left">成交额<span class="pipe">|</span>市值</div>
        <div class="head-right">价格<span class="pipe">|</span>涨幅</div>
      </div>

      <div id="list" class="list">
        <div class="skeleton" aria-label="加载中">
          <div class="sk-row"></div>
          <div class="sk-row"></div>
          <div class="sk-row"></div>
          <div class="sk-row"></div>
          <div class="sk-row"></div>
        </div>
      </div>
    </div>

    <nav class="bottom-nav">
      <a href="index.html" class="nav-item"><i class="fas fa-home"></i><span>首页</span></a>
      <a href="earn.html" class="nav-item"><i class="fas fa-coins"></i><span>赚币</span></a>
      <a href="model.html" class="nav-item"><i class="fas fa-robot"></i><span>模型</span></a>
      <a href="wallet.html" class="nav-item"><i class="fas fa-wallet"></i><span>钱包</span></a>
    </nav>
  </div>

  <script>
    (function () {
      const PROXY_URL = 'https://nqqbtjthryxlwfylfcvd.supabase.co/functions/v1/okx-proxy';
      const REFRESH_INTERVAL = 30_000;

      const listEl = document.getElementById('list');
      const statusEl = document.getElementById('status');
      const chainBtns = Array.from(document.querySelectorAll('.chain-btn'));
      const sortByEl = document.getElementById('sortBy');
      const timeFrameEl = document.getElementById('timeFrame');
      const searchInput = document.getElementById('searchInput');
      const searchBtn = document.getElementById('searchBtn');
      const clearBtn = document.getElementById('clearBtn');

      let currentChain = '501,56,196';
      let allCoins = [];
      let lastFingerprint = '';
      let lastFetchAt = 0;
      let timer = null;

      function escapeHtml(s) {
        return String(s ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function formatPrice(v) {
        const n = Number.parseFloat(v);
        if (!Number.isFinite(n)) return '-';
        if (n === 0) return '$0';
        if (n < 0.000001) return '$' + n.toFixed(10);
        if (n < 0.001)    return '$' + n.toFixed(8);
        if (n < 1)        return '$' + n.toFixed(6);
        return '$' + n.toFixed(4);
      }

      function formatLarge(v) {
        const n = Number.parseFloat(v);
        if (!Number.isFinite(n) || n === 0) return '-';
        if (n >= 1e9) return '$' + (n / 1e9).toFixed(2) + 'B';
        if (n >= 1e6) return '$' + (n / 1e6).toFixed(2) + 'M';
        if (n >= 1e3) return '$' + (n / 1e3).toFixed(2) + 'K';
        return '$' + n.toFixed(2);
      }

      function setStatus(text) { statusEl.textContent = text || ''; }

      function skeleton() {
        listEl.innerHTML = `
          <div class="skeleton" aria-label="加载中">
            <div class="sk-row"></div><div class="sk-row"></div>
            <div class="sk-row"></div><div class="sk-row"></div><div class="sk-row"></div>
          </div>`;
      }

      function render(coins) {
        if (!coins || coins.length === 0) {
          listEl.innerHTML = '<div class="empty">暂无数据</div>';
          return;
        }

        let html = '';
        coins.forEach((coin) => {
          const symbol = escapeHtml(String(coin.symbol || '').trim() || '-');
          const price = formatPrice(coin.current_price);

          const chgRaw = Number.parseFloat(coin.price_change_percentage_24h);
          const chg = Number.isFinite(chgRaw) ? chgRaw : 0;
          const cls = chg >= 0 ? 'pos' : 'neg';
          const chgText = (chg >= 0 ? '+' : '') + chg.toFixed(2) + '%';

          const mcap = formatLarge(coin.market_cap);
          const vol = formatLarge(coin.total_volume);

          let logoHtml = escapeHtml(symbol.charAt(0) || '?');
          if (coin.image) {
            try {
              const u = new URL(coin.image);
              if (u.protocol === 'https:' || u.protocol === 'http:') {
                const safeImg = escapeHtml(coin.image);
                const safeAlt = escapeHtml(symbol.charAt(0) || '?');
                logoHtml = `<img src="${safeImg}" alt="${safeAlt}" loading="lazy" onerror="this.parentNode.textContent=this.alt">`;
              }
            } catch (_) { /* keep fallback */ }
          }

          html += `
            <div class="row" role="row" aria-label="${symbol}">
              <div class="left">
                <div class="logo">${logoHtml}</div>
                <div class="meta">
                  <div class="sym">${symbol}</div>
                  <div class="subline"><b>${vol}</b> • <b>${mcap}</b></div>
                </div>
              </div>

              <div class="right">
                <div class="price">${price}</div>
                <div class="chg ${cls}">${chgText}</div>
              </div>
            </div>`;
        });

        listEl.innerHTML = html;
      }

      function applySearch() {
        const q = searchInput.value.trim().toLowerCase();
        if (!q) { render(allCoins); return; }
        const filtered = allCoins.filter(c =>
          String(c.symbol || '').toLowerCase().includes(q)
        );
        render(filtered);
      }

      async function fetchToplist({ chain, silent }) {
        const sortBy = parseInt(sortByEl.value, 10);
        const timeFrame = parseInt(timeFrameEl.value, 10);

        try {
          if (!silent) skeleton();

          const response = await fetch(PROXY_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ chainIndex: chain, sortBy, timeFrame })
          });

          if (!response.ok) {
            if (response.status === 404) {
              listEl.innerHTML = `<div class="error">接口 404：Edge Function <code>okx-proxy</code> 未部署。</div>`;
              setStatus('刷新失败'); return;
            }
            if (response.status === 401) {
              listEl.innerHTML = `<div class="error">接口 401：请在 Supabase 控制台关闭 Edge Function 的 Verify JWT 选项。</div>`;
              setStatus('刷新失败'); return;
            }
            const text = await response.text();
            throw new Error('HTTP ' + response.status + ': ' + text);
          }

          const json = await response.json();
          if (!json.success) throw new Error(json.error || 'API 返回失败');

          const coins = Array.isArray(json.data) ? json.data : [];
          const fp = JSON.stringify(coins);
          if (fp !== lastFingerprint) {
            lastFingerprint = fp;
            allCoins = coins;
            applySearch();
          }

          lastFetchAt = Date.now();
          setStatus('更新于 ' + new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' }));
        } catch (e) {
          console.error(e);
          if (!silent) listEl.innerHTML = `<div class="error">加载失败：${escapeHtml(e.message)}</div>`;
          setStatus('刷新失败');
        }
      }

      function startTimer() {
        if (timer) clearInterval(timer);
        timer = setInterval(() => {
          if (!document.hidden) fetchToplist({ chain: currentChain, silent: true });
        }, REFRESH_INTERVAL);
      }

      chainBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          chainBtns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentChain = btn.dataset.chain || '501,56,196';
          lastFingerprint = '';
          fetchToplist({ chain: currentChain, silent: false });
        });
      });

      sortByEl.addEventListener('change', () => {
        lastFingerprint = '';
        fetchToplist({ chain: currentChain, silent: false });
      });

      timeFrameEl.addEventListener('change', () => {
        lastFingerprint = '';
        fetchToplist({ chain: currentChain, silent: false });
      });

      searchBtn.addEventListener('click', applySearch);
      searchInput.addEventListener('keydown', e => { if (e.key === 'Enter') applySearch(); });
      searchInput.addEventListener('input', () => {
        clearBtn.style.display = searchInput.value ? 'block' : 'none';
      });
      clearBtn.addEventListener('click', () => {
        searchInput.value = '';
        clearBtn.style.display = 'none';
        render(allCoins);
      });

      document.addEventListener('visibilitychange', () => {
        if (!document.hidden && Date.now() - lastFetchAt >= REFRESH_INTERVAL) {
          fetchToplist({ chain: currentChain, silent: true });
        }
      });

      // active nav
      const page = window.location.pathname.split('/').pop() || 'meme-toplist.html';
      document.querySelectorAll('.nav-item').forEach(a => {
        if (a.getAttribute('href') === page) a.classList.add('active');
      });

      // init
      fetchToplist({ chain: currentChain, silent: false });
      startTimer();
    })();
  </script>
</body>
</html>
