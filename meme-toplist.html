<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Meme 热门榜 · 行情</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --primary: #8b5cf6;
      --primary-dark: #7c3aed;
      --primary-light: #ede9fe;
      --primary-gradient: linear-gradient(145deg, #8b5cf6, #7c3aed);

      --bg: radial-gradient(circle at 10% 20%, #ffffff, #f5f3ff);
      --card: rgba(255,255,255,0.78);
      --stroke: rgba(255,255,255,0.65);
      --line: rgba(148,163,184,0.35);

      --text: #0f172a;
      --muted: #64748b;

      --shadow: 0 20px 40px -18px rgba(0,0,0,0.14);
      --shadow-hover: 0 30px 45px -16px rgba(139,92,246,0.20);

      --green: #10b981;
      --red: #ef4444;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      padding: 18px 16px 90px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      color: var(--text);
    }

    .app { width: 100%; max-width: 700px; }

    /* header */
    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }
    .title-wrap { display: flex; gap: 12px; align-items: flex-start; }
    .back {
      width: 42px; height: 42px;
      border-radius: 9999px;
      display: grid; place-items: center;
      text-decoration: none;
      color: var(--primary);
      background: rgba(255,255,255,0.65);
      border: 1px solid var(--stroke);
      backdrop-filter: blur(10px);
      transition: .2s;
      flex-shrink: 0;
    }
    .back:hover { background: var(--primary); color: #fff; border-color: var(--primary); }

    h1 {
      margin: 0;
      font-size: 1.75rem;
      letter-spacing: -0.02em;
      line-height: 1.15;
      font-weight: 800;
    }
    .subtitle {
      margin-top: 6px;
      font-size: 0.88rem;
      color: var(--muted);
      line-height: 1.35;
    }

    .tool {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      padding-top: 2px;
    }
    .refresh-btn {
      cursor: pointer;
      padding: 10px 12px;
      border-radius: 9999px;
      background: rgba(255,255,255,0.72);
      border: 1px solid var(--stroke);
      color: var(--text);
      backdrop-filter: blur(10px);
      transition: .2s;
      display: inline-flex; align-items: center; gap: 8px;
      font-weight: 700; font-size: 0.9rem;
    }
    .refresh-btn:active { transform: scale(0.98); }
    .status { font-size: 0.78rem; color: var(--muted); white-space: nowrap; }

    /* card */
    .card {
      background: var(--card);
      border: 1px solid var(--stroke);
      border-radius: 26px;
      box-shadow: var(--shadow);
      padding: 16px;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    /* segmented: chain */
    .segmented {
      display: flex; gap: 8px; padding: 6px;
      border-radius: 9999px;
      background: rgba(255,255,255,0.72);
      border: 1px solid var(--stroke);
      overflow-x: auto; -webkit-overflow-scrolling: touch;
    }
    .segmented button {
      border: none; cursor: pointer;
      padding: 10px 14px; border-radius: 9999px;
      background: transparent; color: var(--muted);
      font-weight: 800; white-space: nowrap; transition: .2s;
      display: inline-flex; align-items: center; gap: 8px;
    }
    .segmented button.active {
      background: var(--primary-gradient); color: #fff;
      box-shadow: 0 10px 18px -12px rgba(139,92,246,0.6);
    }
    .pill-dot { width: 8px; height: 8px; border-radius: 99px; background: currentColor; opacity: .55; }
    .segmented button.active .pill-dot { opacity: 1; }

    /* filters */
    .filters {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px;
    }
    .select {
      background: rgba(255,255,255,0.72);
      border: 1px solid var(--stroke); border-radius: 16px;
      padding: 10px 12px; display: flex; gap: 10px; align-items: center;
    }
    .select label { font-size: 0.78rem; font-weight: 800; color: var(--muted); min-width: 52px; }
    .select select {
      width: 100%; border: none; background: transparent; outline: none;
      font-weight: 800; color: var(--text); font-size: 0.92rem; cursor: pointer;
    }

    /* search */
    .search {
      display: flex; align-items: center; gap: 10px; margin-top: 12px;
      background: rgba(255,255,255,0.72);
      border: 1px solid var(--stroke); border-radius: 9999px;
      padding: 6px 6px 6px 14px;
    }
    .search i { color: var(--muted); }
    .search input {
      flex: 1; border: none; outline: none; background: transparent;
      font-size: 0.98rem; padding: 10px 0; font-weight: 700; color: var(--text);
    }
    .search button {
      border: none; cursor: pointer; padding: 10px 16px; border-radius: 9999px;
      background: var(--primary-gradient); color: #fff; font-weight: 900; transition: .2s;
    }
    .search button:active { transform: scale(0.98); }

    /* table header */
    .list-head {
      display: grid;
      grid-template-columns: 40px 1fr 90px 80px 90px 80px 54px;
      gap: 8px; padding: 10px 6px 8px;
      color: var(--muted); font-size: 0.74rem; font-weight: 900;
    }
    @media (max-width: 520px) {
      .list-head { grid-template-columns: 36px 1fr 80px 72px; }
      .list-head .col-mcap,
      .list-head .col-vol,
      .list-head .col-chain { display: none; }
    }

    /* list */
    .list { display: flex; flex-direction: column; gap: 8px; }
    .row {
      display: grid;
      grid-template-columns: 40px 1fr 90px 80px 90px 80px 54px;
      gap: 8px; align-items: center;
      padding: 12px 10px;
      background: rgba(255,255,255,0.86);
      border: 1px solid rgba(226,232,240,0.85);
      border-radius: 18px; transition: .2s; cursor: default;
    }
    .row:hover { transform: translateY(-2px); box-shadow: 0 10px 18px -14px rgba(139,92,246,0.28); }
    @media (max-width: 520px) {
      .row { grid-template-columns: 36px 1fr 80px 72px; }
      .row .col-mcap,
      .row .col-vol,
      .row .col-chain { display: none; }
    }

    .rank { font-weight: 900; color: var(--primary); text-align: center; font-variant-numeric: tabular-nums; }
    .token { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .logo {
      width: 34px; height: 34px; border-radius: 9999px;
      background: var(--primary-light); border: 1px solid rgba(139,92,246,0.18);
      display: grid; place-items: center; overflow: hidden; flex: 0 0 auto;
      font-weight: 900; color: var(--primary); font-size: 0.9rem;
    }
    .logo img { width: 100%; height: 100%; object-fit: cover; }
    .meta { min-width: 0; }
    .sym {
      font-weight: 900; letter-spacing: -0.01em;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .tname {
      margin-top: 2px; font-size: 0.76rem; color: var(--muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .price, .col-mcap, .col-vol {
      text-align: right; font-weight: 800; font-variant-numeric: tabular-nums; font-size: 0.88rem;
    }
    .chg {
      text-align: right; font-weight: 800; font-variant-numeric: tabular-nums;
      display: inline-flex; justify-content: flex-end; align-items: center; gap: 4px;
      font-size: 0.88rem;
    }
    .col-chain {
      text-align: center; font-size: 0.74rem; font-weight: 700;
      color: var(--muted); padding: 2px 6px;
      background: var(--primary-light); border-radius: 8px;
    }
    .pos { color: var(--green); }
    .neg { color: var(--red); }

    /* skeleton */
    .skeleton { display: flex; flex-direction: column; gap: 8px; }
    .sk-row {
      height: 62px; border-radius: 18px;
      background: linear-gradient(90deg, rgba(226,232,240,0.55), rgba(226,232,240,0.35), rgba(226,232,240,0.55));
      background-size: 200% 100%; animation: shimmer 1.1s infinite;
      border: 1px solid rgba(226,232,240,0.65);
    }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

    .empty, .error {
      padding: 22px 10px; text-align: center; color: var(--muted); font-weight: 800;
    }
    .error { color: #b45309; }

    /* bottom nav */
    .bottom-nav {
      position: fixed; left: 0; bottom: 0; width: 100%;
      padding: 8px 22px;
      background: rgba(255,255,255,0.82);
      border-top: 1px solid rgba(226,232,240,0.75);
      backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
      display: flex; justify-content: space-around; z-index: 50;
    }
    .nav-item {
      text-decoration: none; color: #94A3B8;
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      padding: 6px 10px; border-radius: 16px; font-size: 11px; font-weight: 900;
      transition: .2s; position: relative;
    }
    .nav-item i { font-size: 20px; }
    .nav-item:hover { color: var(--primary); background: rgba(139,92,246,0.06); }
    .nav-item.active { color: var(--primary); }
    .nav-item.active::after {
      content: ""; position: absolute; bottom: 2px; left: 50%;
      transform: translateX(-50%); width: 4px; height: 4px;
      border-radius: 99px; background: var(--primary);
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="topbar">
      <div class="title-wrap">
        <a class="back" href="index.html" aria-label="返回"><i class="fas fa-arrow-left"></i></a>
        <div>
          <h1>Meme 热门榜</h1>
          <div class="subtitle">OKX Wallet · 按涨幅 / 成交量 / 市值排序（最多 100 条）</div>
        </div>
      </div>

      <div class="tool">
        <button id="refreshBtn" class="refresh-btn" type="button">
          <i class="fas fa-rotate"></i> 刷新
        </button>
        <div id="status" class="status"></div>
      </div>
    </div>

    <div class="card">
      <!-- chain tabs -->
      <div class="segmented" role="tablist" aria-label="网络选择">
        <button class="chain-btn active" data-chain="501" type="button"><span class="pill-dot"></span>Solana</button>
        <button class="chain-btn" data-chain="56" type="button"><span class="pill-dot"></span>BNB</button>
        <button class="chain-btn" data-chain="196" type="button"><span class="pill-dot"></span>X Layer</button>
        <button class="chain-btn" data-chain="501,56,196" type="button"><span class="pill-dot"></span>全部</button>
      </div>

      <div class="filters">
        <div class="select">
          <label for="sortBy">排序</label>
          <select id="sortBy">
            <option value="2">涨幅</option>
            <option value="5">成交量</option>
            <option value="6">市值</option>
          </select>
        </div>
        <div class="select">
          <label for="timeFrame">周期</label>
          <select id="timeFrame">
            <option value="1">5m</option>
            <option value="2">1h</option>
            <option value="3">4h</option>
            <option value="4" selected>24h</option>
          </select>
        </div>
      </div>

      <div class="search">
        <i class="fas fa-magnifying-glass"></i>
        <input id="searchInput" type="text" placeholder="搜索 Symbol 或名称（如 BONK）" />
        <button id="searchBtn" type="button">搜索</button>
      </div>

      <div class="list-head">
        <div>#</div>
        <div>币种</div>
        <div style="text-align:right;">价格</div>
        <div style="text-align:right;">涨跌 24h</div>
        <div class="col-mcap" style="text-align:right;">市值</div>
        <div class="col-vol" style="text-align:right;">成交量</div>
        <div class="col-chain" style="text-align:center;">链</div>
      </div>

      <div id="list" class="list">
        <div class="skeleton" aria-label="加载中">
          <div class="sk-row"></div>
          <div class="sk-row"></div>
          <div class="sk-row"></div>
          <div class="sk-row"></div>
          <div class="sk-row"></div>
        </div>
      </div>
    </div>

    <nav class="bottom-nav">
      <a href="index.html" class="nav-item"><i class="fas fa-home"></i><span>首页</span></a>
      <a href="earn.html" class="nav-item"><i class="fas fa-coins"></i><span>赚币</span></a>
      <a href="model.html" class="nav-item"><i class="fas fa-robot"></i><span>模型</span></a>
      <a href="wallet.html" class="nav-item"><i class="fas fa-wallet"></i><span>钱包</span></a>
    </nav>
  </div>

  <script>
    (function () {
      const PROXY_URL = 'https://nqqbtjthryxlwfylfcvd.supabase.co/functions/v1/okx-proxy';
      const REFRESH_INTERVAL = 30_000;

      const listEl = document.getElementById('list');
      const statusEl = document.getElementById('status');
      const refreshBtn = document.getElementById('refreshBtn');
      const chainBtns = Array.from(document.querySelectorAll('.chain-btn'));
      const sortByEl = document.getElementById('sortBy');
      const timeFrameEl = document.getElementById('timeFrame');
      const searchInput = document.getElementById('searchInput');
      const searchBtn = document.getElementById('searchBtn');

      let currentChain = '501';
      let allCoins = [];
      let lastFingerprint = '';
      let lastFetchAt = 0;
      let timer = null;

      // ── helpers ──────────────────────────────────────────────────
      function escapeHtml(s) {
        return String(s ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function formatPrice(v) {
        const n = Number.parseFloat(v);
        if (!Number.isFinite(n)) return '-';
        if (n === 0) return '$0';
        if (n < 0.000001) return '$' + n.toFixed(10);
        if (n < 0.001)    return '$' + n.toFixed(8);
        if (n < 1)        return '$' + n.toFixed(6);
        return '$' + n.toFixed(4);
      }

      function formatLarge(v) {
        const n = Number.parseFloat(v);
        if (!Number.isFinite(n) || n === 0) return '-';
        if (n >= 1e9) return '$' + (n / 1e9).toFixed(2) + 'B';
        if (n >= 1e6) return '$' + (n / 1e6).toFixed(2) + 'M';
        if (n >= 1e3) return '$' + (n / 1e3).toFixed(2) + 'K';
        return '$' + n.toFixed(2);
      }

      function chainLabel(chainIndex) {
        const map = { '501': 'SOL', '56': 'BNB', '196': 'XLayer', '1': 'ETH', '137': 'MATIC' };
        return map[String(chainIndex)] || String(chainIndex);
      }

      function setStatus(text) { statusEl.textContent = text || ''; }

      function skeleton() {
        listEl.innerHTML = `
          <div class="skeleton" aria-label="加载中">
            <div class="sk-row"></div><div class="sk-row"></div>
            <div class="sk-row"></div><div class="sk-row"></div><div class="sk-row"></div>
          </div>`;
      }

      // ── render ───────────────────────────────────────────────────
      function render(coins) {
        if (!coins || coins.length === 0) {
          listEl.innerHTML = '<div class="empty">暂无数据</div>';
          return;
        }
        let html = '';
        coins.forEach((coin, idx) => {
          const symbol = escapeHtml(String(coin.symbol || '').trim() || '-');
          const name   = escapeHtml(String(coin.name   || '').trim() || 'Meme Token');
          const price  = formatPrice(coin.current_price);
          const chg    = Number.isFinite(coin.price_change_percentage_24h)
                           ? coin.price_change_percentage_24h : 0;
          const cls    = chg >= 0 ? 'pos' : 'neg';
          const icon   = chg >= 0 ? 'fa-arrow-up' : 'fa-arrow-down';
          const mcap   = formatLarge(coin.market_cap);
          const vol    = formatLarge(coin.total_volume);
          const chain  = escapeHtml(chainLabel(coin.chain));

          // validate image URL
          let logoHtml = escapeHtml(symbol.charAt(0) || '?');
          if (coin.image) {
            try {
              const u = new URL(coin.image);
              if (u.protocol === 'https:' || u.protocol === 'http:') {
                const safeImg = escapeHtml(coin.image);
                const safeAlt = escapeHtml(symbol.charAt(0) || '?');
                logoHtml = `<img src="${safeImg}" alt="${safeAlt}" loading="lazy" onerror="this.parentNode.textContent=this.alt">`;
              }
            } catch (_) { /* keep fallback */ }
          }

          html += `
            <div class="row" role="row" aria-label="${symbol}">
              <div class="rank">${idx + 1}</div>
              <div class="token">
                <div class="logo">${logoHtml}</div>
                <div class="meta">
                  <div class="sym">${symbol}</div>
                  <div class="tname">${name}</div>
                </div>
              </div>
              <div class="price">${price}</div>
              <div class="chg ${cls}"><i class="fas ${icon}"></i> ${Math.abs(chg).toFixed(2)}%</div>
              <div class="col-mcap">${mcap}</div>
              <div class="col-vol">${vol}</div>
              <div class="col-chain">${chain}</div>
            </div>`;
        });
        listEl.innerHTML = html;
      }

      function applySearch() {
        const q = searchInput.value.trim().toLowerCase();
        if (!q) { render(allCoins); return; }
        const filtered = allCoins.filter(c =>
          String(c.symbol || '').toLowerCase().includes(q) ||
          String(c.name   || '').toLowerCase().includes(q)
        );
        render(filtered);
      }

      // ── fetch ────────────────────────────────────────────────────
      async function fetchToplist({ chain, silent }) {
        const sortBy    = parseInt(sortByEl.value, 10);
        const timeFrame = parseInt(timeFrameEl.value, 10);
        try {
          if (!silent) skeleton();

          const response = await fetch(PROXY_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ chainIndex: chain, sortBy, timeFrame })
          });

          if (!response.ok) {
            if (response.status === 404) {
              listEl.innerHTML = `<div class="error">接口 404：Edge Function <code>okx-proxy</code> 未部署。<br>请运行：<code>supabase functions deploy okx-proxy --no-verify-jwt</code></div>`;
              setStatus('刷新失败'); return;
            }
            if (response.status === 401) {
              listEl.innerHTML = `<div class="error">接口 401：请在 Supabase 控制台关闭 Edge Function 的 Verify JWT 选项。</div>`;
              setStatus('刷新失败'); return;
            }
            const text = await response.text();
            throw new Error('HTTP ' + response.status + ': ' + text);
          }

          const json = await response.json();

          if (!json.success) {
            throw new Error(json.error || 'API 返回失败');
          }

          const coins = Array.isArray(json.data) ? json.data : [];
          const fp = JSON.stringify(coins);
          if (fp !== lastFingerprint) {
            lastFingerprint = fp;
            allCoins = coins;
            applySearch();
          }

          lastFetchAt = Date.now();
          setStatus('更新于 ' + new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' }));
        } catch (e) {
          console.error(e);
          if (!silent) listEl.innerHTML = `<div class="error">加载失败：${escapeHtml(e.message)}</div>`;
          setStatus('刷新失败');
        }
      }

      function startTimer() {
        if (timer) clearInterval(timer);
        timer = setInterval(() => {
          if (!document.hidden) fetchToplist({ chain: currentChain, silent: true });
        }, REFRESH_INTERVAL);
      }

      // ── events ───────────────────────────────────────────────────
      chainBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          chainBtns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentChain = btn.dataset.chain || '501';
          lastFingerprint = '';
          fetchToplist({ chain: currentChain, silent: false });
        });
      });

      sortByEl.addEventListener('change', () => {
        lastFingerprint = '';
        fetchToplist({ chain: currentChain, silent: false });
      });

      timeFrameEl.addEventListener('change', () => {
        lastFingerprint = '';
        fetchToplist({ chain: currentChain, silent: false });
      });

      searchBtn.addEventListener('click', applySearch);
      searchInput.addEventListener('keydown', e => { if (e.key === 'Enter') applySearch(); });

      refreshBtn.addEventListener('click', () => {
        lastFingerprint = '';
        fetchToplist({ chain: currentChain, silent: false });
      });

      document.addEventListener('visibilitychange', () => {
        if (!document.hidden && Date.now() - lastFetchAt >= REFRESH_INTERVAL) {
          fetchToplist({ chain: currentChain, silent: true });
        }
      });

      // active nav
      const page = window.location.pathname.split('/').pop() || 'meme-toplist.html';
      document.querySelectorAll('.nav-item').forEach(a => {
        if (a.getAttribute('href') === page) a.classList.add('active');
      });

      // init
      fetchToplist({ chain: currentChain, silent: false });
      startTimer();
    })();
  </script>
</body>
</html>
