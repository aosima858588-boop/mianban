<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>登录 · 海豚社区</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="card" style="max-width: 400px;">
        <div style="text-align: center; margin-bottom: 2rem;">
            <i class="fas fa-water" style="font-size: 3rem; color: var(--primary);"></i>
            <h1>登录海豚社区</h1>
        </div>

        <form id="loginForm">
            <div style="margin-bottom: 1rem;">
                <label for="email">邮箱</label>
                <input type="email" id="email" placeholder="your@email.com" required>
            </div>
            <div style="margin-bottom: 1rem;">
                <label for="password">密码</label>
                <input type="password" id="password" placeholder="********" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">登录</button>
        </form>

        <p style="text-align: center; margin-top: 1.5rem;">
            还没有账号？ <a href="register.html">立即注册</a>
        </p>
        <p style="text-align: center;">
            <a href="entry.html">返回进入页</a>
        </p>

        <div id="message" style="margin-top: 1rem; text-align: center; color: #ef4444;"></div>
    </div>

    <script type="module">
        import { supabase } from './js/supabase.js'

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault()
            const email = document.getElementById('email').value
            const password = document.getElementById('password').value
            const messageDiv = document.getElementById('message')

            messageDiv.textContent = '登录中…'
            messageDiv.style.color = '#3b82f6'

            const { data, error } = await supabase.auth.signInWithPassword({
                email,
                password
            })

            if (error) {
                messageDiv.textContent = '登录失败：邮箱或密码不正确'
                messageDiv.style.color = '#ef4444'
            } else {
                messageDiv.textContent = '登录成功！正在跳转…'
                messageDiv.style.color = '#10b981'
                setTimeout(() => {
                    window.location.href = 'index.html'
                }, 1000)
            }
        })
    </script>
</body>
</html>
