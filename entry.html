<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>海豚社区 · 引导/注册/登录</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="page-content">
        <!-- 头部 - 仅居中H图标 -->
        <div class="header" style="justify-content:center; padding-top:32px; padding-bottom:48px;">
            <div class="header-icon">H</div>
        </div>

        <!-- 标签切换栏 -->
        <div class="tab-bar">
            <button class="tab active" id="tabGuide">引导</button>
            <button class="tab" id="tabRegister">注册</button>
            <button class="tab" id="tabLogin">登录</button>
        </div>

        <!-- 内容区（三个页面，通过 active 类控制显示） -->

            <!-- 引导页 -->
            <div class="page active" id="guidePage">
                <div class="card">
                    <div class="welcome-title" style="font-size:32px; font-weight:800; color:#0A1929; line-height:1.2; margin-bottom:8px;">欢迎来到<br>海豚社区</div>
                    <div class="welcome-sub" style="font-size:16px; color:#546E7A; font-weight:500; margin-bottom:24px;">探索、赚币、连接，尽在掌握</div>

                    <div class="feature-item" style="display:flex; align-items:center; gap:16px; margin-bottom:24px;">
                        <div class="feature-icon" style="width:56px; height:56px; background:#E3F2FD; border-radius:28px; display:flex; align-items:center; justify-content:center; color:#1A73E8; font-size:28px;"><i class="fas fa-chart-line"></i></div>
                        <div class="feature-text">
                            <h3 style="font-size:18px; font-weight:700; color:#0A1929; margin-bottom:4px;">实时数据</h3>
                            <p style="font-size:14px; color:#546E7A;">质押总量、交易动态一目了然</p>
                        </div>
                    </div>
                    <div class="feature-item" style="display:flex; align-items:center; gap:16px; margin-bottom:24px;">
                        <div class="feature-icon" style="width:56px; height:56px; background:#E3F2FD; border-radius:28px; display:flex; align-items:center; justify-content:center; color:#1A73E8; font-size:28px;"><i class="fas fa-gift"></i></div>
                        <div class="feature-text">
                            <h3 style="font-size:18px; font-weight:700; color:#0A1929; margin-bottom:4px;">丰富工具</h3>
                            <p style="font-size:14px; color:#546E7A;">签到、抽奖、红包等你来拿</p>
                        </div>
                    </div>
                    <div class="feature-item" style="display:flex; align-items:center; gap:16px; margin-bottom:24px;">
                        <div class="feature-icon" style="width:56px; height:56px; background:#E3F2FD; border-radius:28px; display:flex; align-items:center; justify-content:center; color:#1A73E8; font-size:28px;"><i class="fas fa-shield-alt"></i></div>
                        <div class="feature-text">
                            <h3 style="font-size:18px; font-weight:700; color:#0A1929; margin-bottom:4px;">安全可靠</h3>
                            <p style="font-size:14px; color:#546E7A;">多重防护，资产无忧</p>
                        </div>
                    </div>

                    <button class="btn-primary" onclick="switchTab('register')">立即体验</button>
                    <button class="btn-link" onclick="switchTab('login')">已有账号？去登录</button>
                </div>
            </div>

            <!-- 注册页 -->
            <div class="page" id="registerPage">
                <div class="card">
                    <div class="welcome-title" style="font-size:32px; font-weight:800; color:#0A1929; line-height:1.2; margin-bottom:8px;">创建账号</div>
                    <div class="welcome-sub" style="font-size:16px; color:#546E7A; font-weight:500; margin-bottom:24px;">加入海豚社区，开启旅程</div>

                    <form id="registerForm">
                        <div class="input-group">
                            <label class="input-label">手机号 / 邮箱</label>
                            <input class="input-field" type="email" id="regEmail" placeholder="输入邮箱" required>
                        </div>
                        <div class="input-group">
                            <label class="input-label">密码</label>
                            <input class="input-field" type="password" id="regPassword" placeholder="至少8位字符" required>
                        </div>
                        <div class="input-group">
                            <label class="input-label">确认密码</label>
                            <input class="input-field" type="password" id="regConfirm" placeholder="再次输入密码" required>
                        </div>
                        <div id="registerMessage" style="font-size:14px; text-align:center; margin-bottom:8px; min-height:20px;"></div>
                        <button type="submit" class="btn-primary" id="registerBtn">注册</button>
                    </form>

                    <div class="divider">
                        <span class="divider-line"></span>
                        <span>其他方式</span>
                        <span class="divider-line"></span>
                    </div>

                    <div class="social-row">
                        <div class="social-icon"><i class="fab fa-weixin"></i></div>
                        <div class="social-icon"><i class="fab fa-qq"></i></div>
                        <div class="social-icon"><i class="fab fa-apple"></i></div>
                    </div>

                    <div class="terms" style="text-align:center; color:#94A3B8; font-size:13px; margin-top:24px;">
                        点击注册即表示同意 <a href="#" style="color:#1A73E8; text-decoration:none;">用户协议</a> 和 <a href="#" style="color:#1A73E8; text-decoration:none;">隐私政策</a>
                    </div>
                </div>
            </div>

            <!-- 登录页 -->
            <div class="page" id="loginPage">
                <div class="card">
                    <div class="welcome-title" style="font-size:32px; font-weight:800; color:#0A1929; line-height:1.2; margin-bottom:8px;">欢迎回来</div>
                    <div class="welcome-sub" style="font-size:16px; color:#546E7A; font-weight:500; margin-bottom:24px;">登录你的海豚账号</div>

                    <form id="loginForm">
                        <div class="input-group">
                            <label class="input-label">手机号 / 邮箱</label>
                            <input class="input-field" type="email" id="loginEmail" placeholder="输入邮箱" required>
                        </div>
                        <div class="input-group">
                            <label class="input-label">密码</label>
                            <input class="input-field" type="password" id="loginPassword" placeholder="输入密码" required>
                        </div>
                        <div class="forgot-password" style="text-align:right; margin-top:8px;">
                            <a href="#" style="color:#1A73E8; text-decoration:none; font-weight:500; font-size:14px;">忘记密码？</a>
                        </div>
                        <div id="loginMessage" style="font-size:14px; text-align:center; margin-bottom:8px; min-height:20px;"></div>
                        <button type="submit" class="btn-primary" id="loginBtn">登录</button>
                    </form>

                    <div class="divider">
                        <span class="divider-line"></span>
                        <span>社交登录</span>
                        <span class="divider-line"></span>
                    </div>

                    <div class="social-row">
                        <div class="social-icon"><i class="fab fa-weixin"></i></div>
                        <div class="social-icon"><i class="fab fa-qq"></i></div>
                        <div class="social-icon"><i class="fab fa-apple"></i></div>
                    </div>

                    <button class="btn-link" onclick="switchTab('register')">还没有账号？立即注册</button>
                </div>
            </div>
    </div>

    <script type="module">
        import { supabase } from './js/supabase.js'
        import { getCurrentUser } from './js/main.js'

        // ========== 标签切换逻辑 ==========
        const tabGuide = document.getElementById('tabGuide');
        const tabRegister = document.getElementById('tabRegister');
        const tabLogin = document.getElementById('tabLogin');
        const guidePage = document.getElementById('guidePage');
        const registerPage = document.getElementById('registerPage');
        const loginPage = document.getElementById('loginPage');

        // 定义切换函数，暴露到全局以便按钮的 onclick 调用
        window.switchTab = function(tabName) {
            // 移除所有标签和页面的 active 类
            tabGuide.classList.remove('active');
            tabRegister.classList.remove('active');
            tabLogin.classList.remove('active');
            guidePage.classList.remove('active');
            registerPage.classList.remove('active');
            loginPage.classList.remove('active');

            // 根据 tabName 添加对应的 active 类
            if (tabName === 'guide') {
                tabGuide.classList.add('active');
                guidePage.classList.add('active');
            } else if (tabName === 'register') {
                tabRegister.classList.add('active');
                registerPage.classList.add('active');
            } else if (tabName === 'login') {
                tabLogin.classList.add('active');
                loginPage.classList.add('active');
            }
        };

        // 为标签按钮绑定点击事件（除了 onclick 外，也加上事件监听，确保可靠）
        tabGuide.addEventListener('click', function(e) {
            e.preventDefault();
            switchTab('guide');
        });
        tabRegister.addEventListener('click', function(e) {
            e.preventDefault();
            switchTab('register');
        });
        tabLogin.addEventListener('click', function(e) {
            e.preventDefault();
            switchTab('login');
        });

        // ========== 注册表单提交 ==========
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const confirm = document.getElementById('regConfirm').value;
            const msgDiv = document.getElementById('registerMessage');
            const btn = document.getElementById('registerBtn');
            if (password !== confirm) {
                msgDiv.textContent = '两次密码输入不一致，请检查后重试';
                msgDiv.style.color = '#ef4444';
                return;
            }
            btn.disabled = true;
            btn.textContent = '注册中…';
            msgDiv.textContent = '';
            const { data, error } = await supabase.auth.signUp({
                email,
                password,
                options: {
                    data: { username: email.split('@')[0] }
                }
            });
            btn.disabled = false;
            btn.textContent = '注册';
            if (error) {
                msgDiv.textContent = '注册失败：' + error.message;
                msgDiv.style.color = '#ef4444';
            } else {
                msgDiv.textContent = '注册成功！请查收验证邮件后登录。';
                msgDiv.style.color = '#10b981';
                setTimeout(() => switchTab('login'), 2500);
            }
        });

        // ========== 登录表单提交 ==========
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const msgDiv = document.getElementById('loginMessage');
            const btn = document.getElementById('loginBtn');
            btn.disabled = true;
            btn.textContent = '登录中…';
            msgDiv.textContent = '';
            const { error } = await supabase.auth.signInWithPassword({ email, password });
            btn.disabled = false;
            btn.textContent = '登录';
            if (error) {
                msgDiv.textContent = '登录失败：邮箱或密码不正确';
                msgDiv.style.color = '#ef4444';
            } else {
                msgDiv.textContent = '登录成功！正在跳转…';
                msgDiv.style.color = '#10b981';
                setTimeout(() => { window.location.href = 'index.html'; }, 800);
            }
        });

        // ========== 可选：检查是否已登录，若已登录直接跳转首页 ==========
        (async () => {
            const user = await getCurrentUser();
            if (user) {
                // 如果已经登录，直接进入首页
                window.location.href = 'index.html';
            }
        })();
    </script>
</body>
</html>
