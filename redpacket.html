<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>红包 · 海豚社区</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* 与 lottery.html 完全相同的头部和底部样式，略去重复 */
        /* 直接复制上面 lottery.html 中的 <style> 内容，并替换主体部分 */
        body { background: linear-gradient(145deg, #f3f0ff, #ede9fe); font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; margin: 0; }
        .glass-card { background: rgba(255,255,255,0.75); backdrop-filter: blur(20px); border-radius: 40px; padding: 28px 24px; box-shadow: 0 20px 40px -15px rgba(0,20,40,0.15); border: 1px solid rgba(255,255,255,0.6); margin-bottom: 20px; }
        .redpacket-card { background: white; border-radius: 32px; padding: 24px; text-align: center; margin: 20px 0; border: 1px solid #e2e8f0; box-shadow: 0 10px 25px -8px rgba(139,92,246,0.15); }
        .redpacket-icon { font-size: 4rem; color: #f44336; margin-bottom: 12px; }
        .redpacket-info { display: flex; justify-content: center; gap: 30px; margin: 20px 0; }
        .info-item { text-align: center; }
        .info-label { font-size: 0.85rem; color: #64748b; margin-bottom: 4px; }
        .info-value { font-size: 2rem; font-weight: 700; color: #8b5cf6; }
        .claim-btn { background: linear-gradient(145deg, #8b5cf6, #6d4aff); border: none; padding: 16px 32px; border-radius: 60px; color: white; font-weight: 700; font-size: 1.4rem; cursor: pointer; box-shadow: 0 15px 30px -8px #8b5cf6; display: inline-flex; align-items: center; gap: 12px; margin: 10px 0; width: 100%; justify-content: center; }
        .claim-btn:disabled { opacity: 0.5; pointer-events: none; }
        .history-section { margin-top: 30px; }
        .history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .history-header h3 { font-size: 1.3rem; font-weight: 700; color: #0a1a2f; }
        .history-list { background: rgba(255,255,255,0.5); border-radius: 30px; padding: 16px; max-height: 200px; overflow-y: auto; }
        .history-item { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #e2e8f0; }
        .history-item:last-child { border-bottom: none; }
        .history-status { font-weight: 600; }
        .history-status.claimed { color: #10b981; }
        .history-status.expired { color: #ef4444; }
        .history-time { color: #64748b; font-size: 0.8rem; }

        /* 气泡和波纹省略，可自行添加 */
    </style>
</head>
<body>
    <div class="page-content">
        <div class="header">
            <a href="index.html" class="back-icon"><i class="fas fa-arrow-left"></i></a>
            <h1></h1>
        </div>


            <div class="glass-card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                    <h2 style="font-size:1.8rem; font-weight:700;">🎁 红包活动</h2>
                </div>

                <div class="redpacket-card">
                    <div class="redpacket-icon"><i class="fas fa-red-envelope"></i></div>
                    <div class="redpacket-info">
                        <div class="info-item">
                            <div class="info-label">剩余个数</div>
                            <div class="info-value" id="remainingCount">10</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">金额</div>
                            <div class="info-value" id="amount">$100</div>
                        </div>
                    </div>
                    <button class="claim-btn" id="claimBtn">
                        <i class="fas fa-hand-holding-heart"></i> 立即领取
                    </button>
                    <button class="fav-btn fav-btn-lg" title="收藏"><i class="fa-regular fa-heart"></i></button>
                </div>

                <div class="history-section">
                    <div class="history-header">
                        <h3><i class="fa-regular fa-clock"></i> 领取记录</h3>
                    </div>
                    <div class="history-list" id="historyList">
                        <div class="history-item"><span class="history-status claimed">已领取</span><span class="history-time">今天 10:23</span></div>
                        <div class="history-item"><span class="history-status expired">已过期</span><span class="history-time">昨天 18:45</span></div>
                        <div class="history-item"><span class="history-status claimed">已领取</span><span class="history-time">03-15 14:12</span></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item"><i class="fas fa-home"></i><span>首页</span></a>
        <a href="earn.html" class="nav-item"><i class="fas fa-coins"></i><span>赚币</span></a>
        <a href="model.html" class="nav-item"><i class="fas fa-robot"></i><span>模型</span></a>
        <a href="wallet.html" class="nav-item"><i class="fas fa-wallet"></i><span>钱包</span></a>
    </nav>

    <script>
        (function() {
            let remaining = 10;
            const claimBtn = document.getElementById('claimBtn');
            const remainingSpan = document.getElementById('remainingCount');
            const historyList = document.getElementById('historyList');

            function addHistory(status) {
                let now = new Date();
                let time = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
                let item = document.createElement('div');
                item.className = 'history-item';
                item.innerHTML = `<span class="history-status ${status === '已领取' ? 'claimed' : 'expired'}">${status}</span><span class="history-time">今天 ${time}</span>`;
                historyList.prepend(item);
                while (historyList.children.length > 5) historyList.removeChild(historyList.lastChild);
            }

            claimBtn.addEventListener('click', () => {
                if (remaining > 0) {
                    remaining--;
                    remainingSpan.textContent = remaining;
                    alert('领取成功！红包已到账');
                    addHistory('已领取');
                    if (remaining === 0) {
                        claimBtn.disabled = true;
                        claimBtn.innerHTML = '<i class="fas fa-ban"></i> 已领完';
                    }
                } else {
                    alert('红包已领完');
                }
            });

            document.querySelectorAll('.fav-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    this.classList.toggle('active');
                    const icon = this.querySelector('i');
                    icon.className = this.classList.contains('active') ? 'fa-solid fa-heart' : 'fa-regular fa-heart';
                    this.classList.add('pop');
                    this.addEventListener('animationend', () => this.classList.remove('pop'), { once: true });
                });
            });

            // 底部导航高亮
            let current = window.location.pathname.split('/').pop() || 'index.html';
            document.querySelectorAll('.nav-item').forEach(a => {
                if (a.getAttribute('href') === current) a.classList.add('active');
            });
        })();
    </script>
</body>
</html>
