<body>
    <div id="particles"></div>
    <div class="app-container" style="padding: 0 12px;">
        <a href="index.html" class="back-button"><i class="fas fa-arrow-left"></i> 返回首页</a>

        <!-- 搜索卡片 -->
        <div class="card">
            <h2><i class="fas fa-search" style="color: #2a4b7c;"></i> 查询投资者</h2>
            <div class="search-box">
                <div class="search-input-wrapper" style="position: relative;">
                    <label style="font-size: 0.9rem; font-weight: 500; color: #2a4b7c; margin-bottom: 6px; display: block;">📱 手机号 / 地址</label>
                    <input type="text" id="searchInput" placeholder="例如 13800138000 或 0xabc..." inputmode="search" class="search-field">
                    <span id="clearInput" class="clear-button" onclick="document.getElementById('searchInput').value=''; this.style.display='none'; document.getElementById('searchBtn').disabled=true;">&times;</span>
                </div>
                <button class="btn-primary" id="searchBtn" style="margin-top: 12px;" disabled><i class="fas fa-magnifying-glass"></i> 查询</button>
            </div>
        </div>

        <!-- 全局统计卡片、结果区域、空状态等，与之前相同，此处省略 -->
        <!-- 实际使用时请保留之前的所有HTML内容 -->

    <script src="js/data.js"></script>
    <script>
        (function() {
            // 禁用双指缩放（部分浏览器需要）
            document.addEventListener('touchmove', function(e) {
                if (e.touches.length > 1) e.preventDefault();
            }, { passive: false });

            // --- 配置 ---
            const CUTOFF_DATE = new Date(2026, 0, 26);
            const INJ_DAILY_RATE = 0.001;

            // --- DOM 缓存 ---
            const DOM = {
                searchInput: document.getElementById('searchInput'),
                searchBtn: document.getElementById('searchBtn'),
                clearBtn: document.getElementById('clearInput'),
                resultsSection: document.getElementById('results-section'),
                emptyState: document.getElementById('empty-state'),
                loadingState: document.getElementById('loading-state'),
                productsList: document.getElementById('productsList')
            };

            // --- 工具函数（与之前相同，此处省略，实际保留全部）---

            // 确保没有自动聚焦
            // 移除所有可能聚焦的代码

            // 初始化
            window.onload = function() {
                // 不聚焦输入框
                // DOM.searchInput.focus();  // 已删除

                // 输入框事件绑定
                DOM.searchInput.addEventListener('input', function() {
                    const hasText = this.value.trim() !== '';
                    DOM.clearBtn.style.display = hasText ? 'flex' : 'none';
                    DOM.searchBtn.disabled = !hasText;
                });

                DOM.searchBtn.addEventListener('click', function() {
                    if (DOM.searchBtn.disabled) return;
                    DOM.searchBtn.disabled = true;
                    searchInvestments(DOM.searchInput.value);
                });

                DOM.searchInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter' && !DOM.searchBtn.disabled) {
                        DOM.searchBtn.disabled = true;
                        searchInvestments(DOM.searchInput.value);
                    }
                });

                // 创建粒子效果等
                createParticles();
                calculateGlobalStats();

                // 移除所有可能导致锁死的 resize 监听（或简化）
                // 不再添加自动滚动，让浏览器自己处理
            };

            // 以下为原有函数定义（parseChineseDate, formatDate, 等），请保留之前的所有函数代码。
            // 为完整起见，请将之前回答中的所有函数（从 parseChineseDate 到 displayResults）复制至此。
            // 因篇幅限制，此处不重复列出，请确保最终文件包含完整的函数实现。
        })();
    </script>
