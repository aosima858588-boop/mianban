<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>下载中心 - 海豚社区</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <style>
    :root{
      --primary:#1A73E8;

      --bg:#f6f9ff;
      --bg2:#ffffff;

      --glass: rgba(255,255,255,.72);
      --glass-strong: rgba(255,255,255,.92);
      --stroke: rgba(26,115,232,.14);
      --shadow: 0 18px 55px rgba(2, 8, 23, .10);

      --text:#0b1220;
      --muted:#64748b;

      --r-xl: 30px;
      --r-lg: 22px;

      --nav-h: 76px;
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Noto Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);

      background:
        radial-gradient(1000px 650px at 10% 0%, rgba(26,115,232,.16), transparent 55%),
        radial-gradient(900px 600px at 90% 10%, rgba(26,115,232,.10), transparent 55%),
        linear-gradient(180deg, var(--bg), var(--bg2));
    }

    .page{
      min-height: 100%;
      padding-bottom: calc(var(--nav-h) + 18px);
    }
    .container{
      max-width: 980px;
      margin: 0 auto;
      padding: 18px;
    }

    .topbar{
      display:flex;
      align-items:center;
      gap: 12px;
      padding: 10px 0 14px;
    }

    .back-btn{
      width: 46px;
      height: 46px;
      border-radius: 999px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      text-decoration:none;

      color: var(--primary);
      background: rgba(255,255,255,.95);
      border: 1px solid rgba(26,115,232,.16);
      box-shadow: 0 12px 26px rgba(2,8,23,.08);

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);

      transition: transform .08s ease, box-shadow .18s ease;
    }
    .back-btn:hover{
      transform: translateY(-1px);
      box-shadow: 0 16px 32px rgba(2,8,23,.10);
    }
    .back-btn svg{ width: 20px; height: 20px; }

    .titles{
      flex:1;
      min-width:0;
      display:flex;
      flex-direction:column;
      gap: 3px;
    }
    .titles h1{
      margin:0;
      font-size: 18px;
      font-weight: 980;
      letter-spacing:.2px;
      color: #0b1220;
    }
    .titles p{
      margin:0;
      font-size: 12px;
      color: rgba(15,23,42,.62);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.4;
    }

    .glass-card{
      background: var(--glass);
      border: 1px solid rgba(26,115,232,.12);
      border-radius: var(--r-xl);
      box-shadow: var(--shadow);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      overflow:hidden;
    }

    .section{ padding: 16px; }

    .section-head{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap: 10px;
      margin-bottom: 12px;
    }
    .section-head h2{
      margin:0;
      font-size: 16px;
      font-weight: 980;
      color: #0b1220;
    }
    .pill{
      display:inline-flex;
      align-items:center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid rgba(26,115,232,.16);
      background: rgba(26,115,232,.08);
      color: rgba(26,115,232,.98);
      font-size: 12px;
      font-weight: 950;
      white-space:nowrap;
    }

    .grid{
      display:grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 12px;
    }

    .card{
      grid-column: span 12;
      padding: 14px;
      border-radius: var(--r-lg);
      background: var(--glass-strong);
      border: 1px solid rgba(26,115,232,.12);
      box-shadow: 0 12px 26px rgba(2,8,23,.07);
      overflow:hidden;
      position: relative;
    }

    .card::before{
      content:"";
      position:absolute;
      inset:0;
      background:
        radial-gradient(520px 200px at 12% 0%, rgba(26,115,232,.10), transparent 55%),
        radial-gradient(320px 160px at 90% 10%, rgba(26,115,232,.06), transparent 55%);
      opacity: .75;
      pointer-events:none;
    }
    .card > *{ position: relative; }

    .row{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap: 12px;
    }

    .app{
      display:flex;
      gap: 12px;
      align-items:flex-start;
    }

    .icon{
      width: 44px;
      height: 44px;
      border-radius: 16px;
      border: 1px solid rgba(26,115,232,.14);
      background: rgba(26,115,232,.08);
      color: rgba(26,115,232,.95);
      display:flex;
      align-items:center;
      justify-content:center;
      flex: 0 0 auto;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.75);
    }
    .icon svg{ width: 22px; height: 22px; }

    .meta h3{
      margin:0;
      font-size: 14px;
      font-weight: 990;
      color: #0b1220;
    }
    .meta p{
      margin: 4px 0 0;
      font-size: 12px;
      color: rgba(15,23,42,.62);
      line-height: 1.5;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 999px;
      text-decoration:none;
      border: 1px solid rgba(26,115,232,.18);
      background: rgba(26,115,232,.10);
      color: rgba(26,115,232,.98);
      font-weight: 980;
      font-size: 12px;
      white-space: nowrap;
      transition: transform .06s ease, background .15s ease, box-shadow .18s ease;
      box-shadow: 0 10px 20px rgba(2,8,23,.07);
    }
    .btn:hover{
      transform: translateY(-1px);
      background: rgba(26,115,232,.14);
      box-shadow: 0 14px 26px rgba(2,8,23,.10);
    }
    .btn.primary{
      background: linear-gradient(180deg, rgba(26,115,232,.18), rgba(26,115,232,.10));
      border-color: rgba(26,115,232,.22);
    }

    .note{
      margin-top: 10px;
      font-size: 12px;
      color: rgba(15,23,42,.60);
      line-height: 1.6;
    }
    .note code{
      padding: 2px 6px;
      border-radius: 8px;
      background: rgba(26,115,232,.08);
      border: 1px solid rgba(26,115,232,.12);
      color: rgba(26,115,232,.98);
      font-weight: 900;
    }


    .nav-inner{
      max-width: 1120px;
      margin: 0 auto;
      height: 100%;
      display:grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      align-items:center;
    }

    .nav-item{
      text-decoration:none;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap: 4px;
      padding: 9px 6px;

      border-radius: 18px;
      border: 1px solid transparent;

      color: rgba(15,23,42,.68);
      font-size: 11px;
      font-weight: 980;

      transition: background .15s ease, border-color .15s ease, transform .06s ease;
    }
    .nav-item svg{ width: 20px; height: 20px; }
    .nav-item:hover{
      transform: translateY(-1px);
      background: rgba(26,115,232,.06);
      border-color: rgba(26,115,232,.12);
    }
    .nav-item.active{
      color: var(--primary);
      background: rgba(26,115,232,.10);
      border-color: rgba(26,115,232,.16);
    }

    @media (min-width: 760px){
      .card{ grid-column: span 6; }
    }
    @media (min-width: 980px){
      .card{ grid-column: span 4; }
    }
  </style>
</head>

<body>
  <div class="page-content">

    <div class="header">
        <a href="index.html" class="back-icon"><i class="fas fa-arrow-left"></i></a>
        <h1>下载中心</h1>
      </div>

      <div class="glass-card">
        <div class="section">
          <div class="section-head">
            <h2>选择平台</h2>
            <span class="pill">#1A73E8</span>
          </div>

          <div class="grid">
            <!-- iOS -->
            <div class="card">
              <div class="row">
                <div class="app">
                  <div class="icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none">
                      <path d="M16.5 12.3c.02 2.4 2.1 3.2 2.12 3.22-.02.06-.33 1.13-1.1 2.23-.67.96-1.37 1.92-2.46 1.94-1.07.02-1.41-.63-2.63-.63-1.22 0-1.6.61-2.6.65-1.05.04-1.85-1.05-2.53-2-1.38-2-2.43-5.65-1.01-8.12.7-1.23 1.95-2.01 3.3-2.03 1.03-.02 2 .7 2.63.7.64 0 1.84-.86 3.1-.73.53.02 2.02.22 2.98 1.67-.08.05-1.78 1.04-1.8 3.23Z"
                            stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
                      <path d="M15.2 3.2c.52.66.92 1.58.82 2.5-.94.04-1.96-.54-2.55-1.23-.54-.62-.99-1.61-.86-2.52 1.03-.08 2.03.5 2.59 1.25Z"
                            stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" opacity=".9"/>
                    </svg>
                  </div>
                  <div class="meta">
                    <h3>iOS 下载</h3>
                    <p>App Store / TestFlight（示例占位链接）</p>
                  </div>
                </div>

                <a class="btn primary" href="#" target="_blank" rel="noopener">前往下载</a>
              </div>
              <div class="note">把 <code>href</code> 替换成你的 iOS 下载链接。</div>
            </div>

            <!-- Android -->
            <div class="card">
              <div class="row">
                <div class="app">
                  <div class="icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none">
                      <path d="M7.2 9.2 5.7 6.9M16.8 9.2l1.5-2.3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                      <path d="M8.2 8.7c1.1-.9 2.4-1.4 3.8-1.4s2.7.5 3.8 1.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                      <path d="M7.5 10.2h9A2.5 2.5 0 0 1 19 12.7V17a2.8 2.8 0 0 1-2.8 2.8H7.8A2.8 2.8 0 0 1 5 17v-4.3a2.5 2.5 0 0 1 2.5-2.5Z"
                            stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                      <path d="M8 14.2v2.7M16 14.2v2.7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                      <path d="M9.3 12.8h.01M14.7 12.8h.01" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
                    </svg>
                  </div>
                  <div class="meta">
                    <h3>Android 下载</h3>
                    <p>Google Play / 官网下载（示例占位链接）</p>
                  </div>
                </div>

                <a class="btn primary" href="#" target="_blank" rel="noopener">前往下载</a>
              </div>
              <div class="note">把 <code>href</code> 替换成你的 Android 下载链接。</div>
            </div>

            <!-- APK -->
            <div class="card">
              <div class="row">
                <div class="app">
                  <div class="icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none">
                      <path d="M8.5 3.8h5.8l2.7 2.7v13.7a1.8 1.8 0 0 1-1.8 1.8H8.5a1.8 1.8 0 0 1-1.8-1.8V5.6a1.8 1.8 0 0 1 1.8-1.8Z"
                            stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                      <path d="M14.3 3.8v2.9a1 1 0 0 0 1 1h2.9" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                      <path d="M12 10.2v6.4M9.6 14.2 12 16.6l2.4-2.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                  </div>
                  <div class="meta">
                    <h3>APK 直链下载</h3>
                    <p>适用于无商店渠道安装（示例占位链接）</p>
                  </div>
                </div>

                <a class="btn primary" href="#" target="_blank" rel="noopener">下载 APK</a>
              </div>
              <div class="note">把 <code>href</code> 替换成你的 APK 文件直链（建议 HTTPS）。</div>
            </div>
          </div>

        </div>
      </div>

  </div>

  <!-- 底部导航 -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item"><i class="fas fa-home"></i><span>首页</span></a>
    <a href="earn.html" class="nav-item"><i class="fas fa-coins"></i><span>赚币</span></a>
    <a href="model.html" class="nav-item"><i class="fas fa-robot"></i><span>模型</span></a>
    <a href="wallet.html" class="nav-item"><i class="fas fa-wallet"></i><span>钱包</span></a>
  </nav>

  <script>
    (function() {
      var current = window.location.pathname.split('/').pop() || 'index.html';
      document.querySelectorAll('.nav-item').forEach(function(a) {
        if (a.getAttribute('href') === current) a.classList.add('active');
      });
    })();
  </script>
</body>
</html>
