<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>海豚社区 · 无边框空间感</title>
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <!-- Inter 字体 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <style>
    /* ===== 无边框设计系统 ===== */
    :root {
      /* 背景层 - 极浅灰 */
      --bg-color: #F5F7FA;
      
      /* 内容层 - 白色卡片 */
      --card-color: #FFFFFF;
      
      /* 品牌主色 - 海洋蓝 */
      --brand-color: #0066FF;
      --brand-light: rgba(0, 102, 255, 0.08);
      --brand-gradient: linear-gradient(135deg, #0066FF, #3399FF);
      
      /* 辅助灰色系 */
      --gray-100: #F8F9FA;
      --gray-200: #E9ECEF;
      --gray-300: #DEE2E6;
      --gray-400: #CED4DA;
      --gray-500: #ADB5BD;
      --gray-600: #6C757D;
      --gray-700: #495057;
      --gray-800: #343A40;
      --gray-900: #212529;
      
      /* 功能色 */
      --success: #34C759;
      --danger: #FF3B30;
      
      /* 文字颜色 */
      --text-primary: var(--gray-900);
      --text-secondary: var(--gray-700);
      --text-tertiary: var(--gray-600);
      
      /* 阴影 - 增强悬浮层次 (无边框) */
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.02);
      --shadow-md: 0 8px 24px rgba(0,0,0,0.06);
      --shadow-lg: 0 16px 32px -8px rgba(0,0,0,0.12);
      --shadow-xl: 0 24px 48px -12px rgba(0, 102, 255, 0.12);
      
      /* 圆角 */
      --radius-card: 32px;
      --radius-element: 24px;
      --radius-btn: 60px;
      
      /* 间距 */
      --spacing-xs: 4px;
      --spacing-sm: 8px;
      --spacing-md: 12px;
      --spacing-lg: 16px;
      --spacing-xl: 20px;
      --spacing-xxl: 24px;
      
      /* 过渡 */
      --transition: all 0.2s ease;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 450px;
      margin: 0 auto;
      box-shadow: 0 0 40px rgba(0,0,0,0.02);
    }

    /* 滚动容器 - 内容层 */
    .main-scroll {
      flex: 1;
      overflow-y: auto;
      padding: var(--spacing-lg) var(--spacing-lg) var(--spacing-sm) var(--spacing-lg);
      background: var(--bg-color);
      display: flex;
      flex-direction: column;
      gap: var(--spacing-xl);
      scrollbar-width: thin;
      scrollbar-color: var(--gray-400) var(--gray-200);
    }
    .main-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .main-scroll::-webkit-scrollbar-track {
      background: var(--gray-200);
    }
    .main-scroll::-webkit-scrollbar-thumb {
      background-color: var(--gray-400);
      border-radius: 8px;
    }

    /* 卡片 - 纯白，无边框，强阴影 */
    .card {
      background: var(--card-color);
      border-radius: var(--radius-card);
      padding: var(--spacing-xl) var(--spacing-xl);
      box-shadow: var(--shadow-lg);
      transition: var(--transition);
    }
    .card:active {
      transform: scale(0.998);
      box-shadow: var(--shadow-md);
    }

    /* 可点击元素 */
    .clickable {
      transition: var(--transition);
      cursor: default;
      -webkit-tap-highlight-color: var(--brand-light);
    }
    .clickable:active {
      transform: scale(0.97);
    }

    /* 品牌色高亮 */
    .brand-text {
      color: var(--brand-color);
      font-weight: 600;
    }
    .brand-bg {
      background: var(--brand-gradient);
      color: white;
      box-shadow: 0 8px 20px rgba(0,102,255,0.25);
    }

    /* 顶部用户卡片 */
    .user-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .user-info-clickable {
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
      flex: 1;
      padding: var(--spacing-xs) 0;
      border-radius: 50px;
    }
    .h-icon {
      width: 48px;
      height: 48px;
      background: var(--brand-light);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: 700;
      color: var(--brand-color);
      box-shadow: var(--shadow-sm);
    }
    .nickname {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
    }
    .level-badge {
      background: var(--brand-gradient);
      color: white;
      font-size: 13px;
      font-weight: 600;
      padding: 6px 16px;
      border-radius: 40px;
      box-shadow: 0 6px 14px rgba(0,102,255,0.25);
    }

    /* 充币/提币按钮 - 第二行 */
    .action-row {
      display: flex;
      justify-content: flex-end;
      margin-top: var(--spacing-md);
    }
    .action-buttons {
      display: flex;
      gap: var(--spacing-sm);
    }
    .coin-btn {
      background: var(--gray-100);
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 600;
      padding: 10px 22px;
      border-radius: var(--radius-btn);
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
    }
    .coin-btn:active {
      background: var(--gray-200);
      transform: scale(0.96);
      box-shadow: var(--shadow-sm);
    }

    /* 展开区域 */
    .expand-section {
      margin-top: var(--spacing-lg);
      display: flex;
      flex-wrap: wrap;
      gap: var(--spacing-sm);
      padding-top: var(--spacing-lg);
      border-top: 1px solid transparent; /* 保留视觉分割线但不占边框空间，实际使用虚线更柔和 */
      background: linear-gradient(to right, transparent, var(--gray-300), transparent) 0 0 / 100% 1px no-repeat;
      animation: slideDown 0.2s ease;
    }
    @keyframes slideDown {
      0% { opacity: 0; transform: translateY(-8px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .hidden { display: none; }

    /* 统计框 - 无边框 */
    .stat-box {
      background: var(--gray-100);
      border-radius: var(--radius-element);
      padding: var(--spacing-md) var(--spacing-xs);
      text-align: center;
      flex: 1 0 calc(25% - 8px);
      box-shadow: var(--shadow-sm);
    }
    .stat-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-tertiary);
      margin-bottom: var(--spacing-xs);
    }
    .stat-value {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
    }

    /* 公告卡片 */
    .announcement {
      display: flex;
      align-items: center;
      gap: var(--spacing-md);
      color: var(--text-primary);
      font-weight: 500;
    }
    .announcement i {
      color: var(--brand-color);
      font-size: 22px;
    }
    .announcement span {
      font-weight: 600;
      color: var(--text-primary);
    }

    /* 工具集网格 - 8个 */
    .tools-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--spacing-lg) var(--spacing-sm);
      margin-top: var(--spacing-sm);
    }
    .tool-item {
      background: var(--gray-100);
      border-radius: 24px;
      padding: var(--spacing-lg) var(--spacing-xs) var(--spacing-sm) var(--spacing-xs);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--spacing-xs);
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
    }
    .tool-item:active {
      background: var(--gray-200);
      transform: scale(0.96);
      box-shadow: var(--shadow-sm);
    }
    .tool-item i {
      font-size: 26px;
      color: var(--brand-color);
    }
    .tool-item span {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    /* 最新活动卡片 */
    .activity-content {
      display: flex;
      align-items: center;
      gap: var(--spacing-lg);
    }
    .activity-badge {
      background: var(--brand-gradient);
      color: white;
      font-weight: 600;
      padding: 8px 20px;
      border-radius: 40px;
      font-size: 14px;
      white-space: nowrap;
      box-shadow: 0 8px 18px rgba(0,102,255,0.25);
    }
    .activity-text {
      font-weight: 700;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: var(--spacing-xs);
    }
    .activity-text i {
      color: var(--brand-color);
    }

    /* 便捷访问双按钮 */
    .quick-row {
      display: flex;
      gap: var(--spacing-md);
    }
    .quick-btn {
      flex: 1;
      background: var(--gray-100);
      border-radius: var(--radius-btn);
      padding: 16px 0;
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--spacing-sm);
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
    }
    .quick-btn:active {
      background: var(--gray-200);
      transform: scale(0.97);
      box-shadow: var(--shadow-sm);
    }
    .quick-btn i {
      color: var(--brand-color);
      font-size: 18px;
    }

    /* 轮播卡片 */
    .carousel-card {
      background: var(--card-color);
      border-radius: var(--radius-card);
      padding: var(--spacing-lg) var(--spacing-xl);
      box-shadow: var(--shadow-lg);
    }
    .carousel-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--spacing-md);
    }
    .carousel-text {
      font-size: 17px;
      font-weight: 700;
      color: var(--text-primary);
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
    }
    .carousel-text i {
      color: var(--brand-color);
    }
    .carousel-arrow {
      width: 40px;
      height: 40px;
      background: var(--gray-100);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gray-600);
      font-size: 18px;
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
    }
    .carousel-arrow:active {
      background: var(--gray-200);
      transform: scale(0.94);
      box-shadow: var(--shadow-sm);
    }
    .carousel-indicators {
      display: flex;
      justify-content: center;
      gap: var(--spacing-sm);
      margin-top: var(--spacing-lg);
    }
    .indicator-dot {
      width: 8px;
      height: 8px;
      background: var(--gray-400);
      border-radius: 20px;
      transition: all 0.2s;
    }
    .indicator-dot.active {
      background: var(--brand-color);
      width: 28px;
    }

    /* 代币方形卡片 - 2个并排 */
    .price-squares {
      display: flex;
      gap: var(--spacing-lg);
      margin-bottom: var(--spacing-xs);
    }
    .price-square {
      flex: 1;
      background: var(--card-color);
      border-radius: var(--radius-card);
      padding: var(--spacing-xl) var(--spacing-md) var(--spacing-lg) var(--spacing-md);
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .square-token-icon {
      width: 60px;
      height: 60px;
      background: var(--brand-light);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 700;
      color: var(--brand-color);
      margin-bottom: var(--spacing-md);
      box-shadow: var(--shadow-sm);
    }
    .square-token-name {
      font-weight: 600;
      font-size: 15px;
      color: var(--text-secondary);
      margin-bottom: var(--spacing-xs);
    }
    .square-price {
      font-size: 28px;
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: var(--spacing-sm);
      letter-spacing: -0.5px;
    }
    .square-change {
      font-weight: 600;
      font-size: 16px;
      padding: 6px 18px;
      border-radius: 30px;
      background: var(--gray-100);
      box-shadow: var(--shadow-sm);
    }
    .change-positive { color: var(--success); }
    .change-negative { color: var(--danger); }

    /* 社区数据 - 2x2网格 */
    .community-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--spacing-md);
    }
    .community-item {
      background: var(--gray-100);
      border-radius: var(--radius-element);
      padding: var(--spacing-lg) var(--spacing-sm);
      text-align: center;
      box-shadow: var(--shadow-sm);
    }
    .community-label {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-tertiary);
      margin-bottom: var(--spacing-xs);
    }
    .community-value {
      font-size: 20px;
      font-weight: 700;
      color: var(--brand-color);
    }

    /* 卡片标题 */
    .card-header {
      font-weight: 700;
      font-size: 18px;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
      margin-bottom: var(--spacing-lg);
    }
    .card-header i {
      color: var(--brand-color);
      font-size: 20px;
    }

    /* 底部操作层 - 导航栏 (无边框) */
    .bottom-menu {
      background: var(--card-color);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: var(--spacing-sm) var(--spacing-sm) var(--spacing-lg) var(--spacing-sm);
      box-shadow: 0 -4px 20px rgba(0,0,0,0.04);
    }
    .menu-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--spacing-xs);
      font-size: 11px;
      font-weight: 500;
      color: var(--gray-500);
      padding: var(--spacing-xs) var(--spacing-md);
      border-radius: 30px;
      transition: var(--transition);
    }
    .menu-item i {
      font-size: 22px;
      color: var(--gray-500);
    }
    .menu-item.active i,
    .menu-item.active .menu-label {
      color: var(--brand-color);
      font-weight: 600;
    }
    .menu-item:active {
      background: var(--brand-light);
      transform: scale(0.94);
    }
    .menu-label {
      font-weight: 500;
    }

    /* 分割线 (无边框，用渐变实现) */
    .divider {
      height: 1px;
      background: linear-gradient(to right, transparent, var(--gray-300), transparent);
      margin: var(--spacing-md) 0;
    }
  </style>
</head>
<body>
  <!-- 中层：内容滚动区 -->
  <div class="main-scroll">
    <!-- 1. 顶部用户卡片（可展开） -->
    <div class="card" id="userCard">
      <div class="user-header-row">
        <div class="user-info-clickable" id="expandTrigger">
          <div class="h-icon">H</div>
          <span class="nickname">深海海豚君</span>
          <span class="level-badge">金牌会员</span>
        </div>
      </div>
      <!-- 充币/提币行 -->
      <div class="action-row">
        <div class="action-buttons" id="actionButtons">
          <span class="coin-btn">充币</span>
          <span class="coin-btn">提币</span>
        </div>
      </div>
      <!-- 展开区域（默认隐藏） -->
      <div class="expand-section hidden" id="expandContent">
        <div class="stat-box"><div class="stat-label">身价</div><div class="stat-value">12.5k</div></div>
        <div class="stat-box"><div class="stat-label">资产</div><div class="stat-value">5.2k</div></div>
        <div class="stat-box"><div class="stat-label">贡献度</div><div class="stat-value">3.4k</div></div>
        <div class="stat-box"><div class="stat-label">周排名</div><div class="stat-value">#16</div></div>
      </div>
    </div>

    <!-- 2. 公告资讯 -->
    <div class="card">
      <div class="announcement">
        <i class="fas fa-bullhorn"></i>
        <span>111111</span>
        <i class="fas fa-circle" style="font-size: 6px; color: var(--gray-400); margin-left: auto;"></i>
      </div>
    </div>

    <!-- 3. 社区数据 - 2x2网格 -->
    <div class="card">
      <div class="card-header">
        <i class="fas fa-chart-pie"></i> 社区数据
      </div>
      <div class="community-grid">
        <div class="community-item">
          <div class="community-label">H总质押</div>
          <div class="community-value">12.5M H</div>
        </div>
        <div class="community-item">
          <div class="community-label">总交易量</div>
          <div class="community-value">$2.3B</div>
        </div>
        <div class="community-item">
          <div class="community-label">国库余额</div>
          <div class="community-value">$1.8M</div>
        </div>
        <div class="community-item">
          <div class="community-label">活跃人数</div>
          <div class="community-value">8.2k</div>
        </div>
      </div>
    </div>

    <!-- 4. 工具集 -->
    <div class="card">
      <div class="card-header">
        <i class="fas fa-tools"></i> 常用工具
      </div>
      <div class="tools-grid">
        <div class="tool-item"><i class="fas fa-calendar-check"></i><span>签到</span></div>
        <div class="tool-item"><i class="fas fa-dice"></i><span>抽奖</span></div>
        <div class="tool-item"><i class="fas fa-star"></i><span>积分</span></div>
        <div class="tool-item"><i class="fas fa-gift"></i><span>红包</span></div>
        <div class="tool-item"><i class="fas fa-search"></i><span>查询系统</span></div>
        <div class="tool-item"><i class="fas fa-chart-line"></i><span>社区数据</span></div>
        <div class="tool-item"><i class="fas fa-calculator"></i><span>计算器</span></div>
        <div class="tool-item"><i class="fas fa-download"></i><span>下载中心</span></div>
      </div>
    </div>

    <!-- 5. 最新活动 -->
    <div class="card">
      <div class="card-header">
        <i class="fas fa-fire"></i> 最新活动
      </div>
      <div class="activity-content">
        <span class="activity-badge">OKX Boost</span>
        <span class="activity-text"><i class="fas fa-rocket"></i>最佳策略获得空投</span>
      </div>
    </div>

    <!-- 6. 便捷访问 -->
    <div class="card" style="padding: var(--spacing-lg) var(--spacing-xl);">
      <div class="quick-row">
        <div class="quick-btn"><i class="fas fa-coins"></i> 购买H币</div>
        <div class="quick-btn"><i class="fas fa-users"></i> 进入社区群</div>
      </div>
    </div>

    <!-- 7. 轮播：网格策略 -->
    <div class="carousel-card">
      <div class="carousel-content">
        <span class="carousel-arrow"><i class="fas fa-chevron-left"></i></span>
        <span class="carousel-text"><i class="fas fa-chart-line"></i>网格策略，行情涨跌都能赚</span>
        <span class="carousel-arrow"><i class="fas fa-chevron-right"></i></span>
      </div>
      <div class="carousel-indicators">
        <span class="indicator-dot active"></span>
        <span class="indicator-dot"></span>
        <span class="indicator-dot"></span>
      </div>
    </div>

    <!-- 8. 代币数据 - 方形卡片 -->
    <div class="price-squares">
      <div class="price-square">
        <div class="square-token-icon">OKB</div>
        <div class="square-token-name">OKB</div>
        <div class="square-price">$45.23</div>
        <span class="square-change change-positive">+2.1%</span>
      </div>
      <div class="price-square">
        <div class="square-token-icon">BTC</div>
        <div class="square-token-name">Bitcoin</div>
        <div class="square-price">$48,321</div>
        <span class="square-change change-positive">+0.5%</span>
      </div>
    </div>

    <!-- 底部留白 -->
    <div style="height: var(--spacing-xs);"></div>
  </div>

  <!-- 底层操作层：底部导航栏 (无边框) -->
  <div class="bottom-menu">
    <div class="menu-item active">
      <i class="fas fa-home"></i>
      <span class="menu-label">首页</span>
    </div>
    <div class="menu-item">
      <i class="fas fa-coins"></i>
      <span class="menu-label">赚币</span>
    </div>
    <div class="menu-item">
      <i class="fas fa-cube"></i>
      <span class="menu-label">模型</span>
    </div>
    <div class="menu-item">
      <i class="fas fa-wallet"></i>
      <span class="menu-label">钱包</span>
    </div>
  </div>

  <script>
    (function() {
      const expandTrigger = document.getElementById('expandTrigger');
      const expandContent = document.getElementById('expandContent');
      const actionButtons = document.getElementById('actionButtons');

      expandTrigger.addEventListener('click', function(e) {
        e.stopPropagation();
        expandContent.classList.toggle('hidden');
      });

      actionButtons.addEventListener('click', function(e) {
        e.stopPropagation();
      });
    })();
  </script>
</body>
</html>
