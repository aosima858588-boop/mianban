<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="海豚社区辅助工具，社区数据、常用工具、代币行情一站式服务。">
  <title>海豚社区 · 高饱和精进版</title>
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <!-- Inter 字体优化加载 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <style>
    /* ===== 设计令牌（高饱和度版本） ===== */
    :root {
      /* 背景色 - 微调为更纯净的冷灰，衬托高饱和元素 */
      --bg: #F0F4FA;           /* 原 #F8FAFD，稍深一点增强对比 */
      
      /* 卡片保持纯白 */
      --card: #FFFFFF;
      
      /* 品牌色 - 提高饱和度，更鲜艳的海洋蓝 */
      --brand: #0A66E0;         /* 原 #1D7DF0，更饱和 */
      --brand-light: rgba(10, 102, 224, 0.08);
      --brand-gradient: linear-gradient(145deg, #0A66E0, #3B8CFF);
      
      /* 灰色系统 - 增加色相微调，偏冷灰，提升质感 */
      --gray-soft: #F0F3F7;     /* 原 #F2F4F6，稍冷 */
      --gray-mid: #E1E6ED;      /* 原 #E9ECF0，加深 */
      --gray-border: #CFD7E3;   /* 原 #DDE1E6，加深 */
      --gray-icon: #B0BCCA;     /* 原 #BFC6CD，加深饱和 */
      --gray-text-light: #8A97A8; /* 原 #9AA4B0，加深 */
      --gray-text: #64748B;      /* 原 #7A8593，加深饱和 */
      --gray-text-dark: #334155; /* 原 #5A6573，加深 */
      --gray-heading: #0F172A;   /* 原 #1E293B，更深 */

      /* 文字颜色直接引用 */
      --text-primary: var(--gray-heading);
      --text-secondary: var(--gray-text-dark);
      --text-tertiary: var(--gray-text);
      
      /* 字体权重 */
      --fw-regular: 500;
      --fw-medium: 600;
      --fw-bold: 700;
      --fw-extrabold: 800;

      /* 阴影系统 - 增强光感 */
      --shadow-card: 0 20px 35px -10px rgba(0,20,50,0.12);
      --shadow-elevated: 0 12px 25px -6px rgba(0,20,50,0.15);
      --shadow-flat: 0 6px 14px rgba(0,0,0,0.02);
      --shadow-glow: 0 10px 28px rgba(10,102,224,0.3); /* 品牌光更强 */

      /* 圆角 - 统一 */
      --radius-card: 32px;
      --radius-element: 24px;
      --radius-btn: 60px;
      --radius-circle: 50%;

      /* 间距 - 保留关键档位 */
      --space-xs: 4px;
      --space-sm: 8px;
      --space-md: 12px;
      --space-lg: 16px;
      --space-xl: 20px;
      --space-2xl: 24px;

      /* 动画 */
      --transition: 0.25s cubic-bezier(0.2, 0, 0, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 450px;
      margin: 0 auto;
      -webkit-tap-highlight-color: transparent;
    }

    /* 主滚动区域 */
    .app-main {
      flex: 1;
      overflow-y: auto;
      padding: var(--space-lg) var(--space-lg) var(--space-sm);
      display: flex;
      flex-direction: column;
      gap: var(--space-xl);
      scrollbar-width: thin;
      scrollbar-color: var(--gray-icon) var(--gray-mid);
    }
    .app-main::-webkit-scrollbar {
      width: 4px;
    }
    .app-main::-webkit-scrollbar-track {
      background: var(--gray-mid);
    }
    .app-main::-webkit-scrollbar-thumb {
      background-color: var(--gray-icon);
      border-radius: 8px;
    }

    /* 卡片通用 */
    .card {
      background: var(--card);
      border-radius: var(--radius-card);
      padding: var(--space-xl);
      box-shadow: var(--shadow-card);
      transition: var(--transition);
    }
    .card:active {
      transform: scale(0.998);
      box-shadow: var(--shadow-elevated);
    }

    /* 卡片标题 - 增加文字阴影提升立体感 */
    .card-header {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      margin-bottom: var(--space-lg);
      font-weight: var(--fw-bold);
      font-size: 18px;
      color: var(--text-primary);
      text-shadow: 0 1px 2px rgba(0,0,0,0.02);
    }
    .card-header i {
      color: var(--brand);
      font-size: 20px;
      filter: drop-shadow(0 2px 4px rgba(10,102,224,0.3));
    }

    /* 波纹点击效果（GPU加速） */
    .ripple {
      position: relative;
      overflow: hidden;
      cursor: default;
      transition: var(--transition);
      transform: translateZ(0);
    }
    .ripple:active {
      transform: scale(0.96) translateZ(0);
    }
    .ripple::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: currentColor;
      opacity: 0.1;
      transform: translate(-50%, -50%) scale(0);
      transition: width 0.3s, height 0.3s, opacity 0.3s;
      pointer-events: none;
    }
    .ripple:active::after {
      width: 200px;
      height: 200px;
      opacity: 0;
      transform: translate(-50%, -50%) scale(1);
    }

    /* 用户卡片 */
    .user-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .user-info {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      flex: 1;
      padding: var(--space-xs) 0;
      border-radius: 50px;
    }
    .avatar {
      width: 48px;
      height: 48px;
      background: linear-gradient(145deg, #E0EBFF, #C2D9FF); /* 更饱和 */
      border-radius: var(--radius-circle);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: var(--fw-bold);
      color: var(--brand);
      box-shadow: 0 6px 12px rgba(10,102,224,0.15);
    }
    .nickname {
      font-size: 18px;
      font-weight: var(--fw-bold);
      color: var(--text-primary);
      text-shadow: 0 1px 2px rgba(0,0,0,0.02);
    }
    .badge {
      background: var(--brand-gradient);
      color: white;
      font-size: 13px;
      font-weight: var(--fw-medium);
      padding: 6px 16px;
      border-radius: 40px;
      box-shadow: var(--shadow-glow);
      animation: pulse 2s infinite;
      text-shadow: 0 1px 2px rgba(0,0,0,0.1);
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(10,102,224,0.4); }
      70% { box-shadow: 0 0 0 8px rgba(10,102,224,0); }
    }

    /* 充提币按钮组 */
    .action-row {
      display: flex;
      justify-content: flex-end;
      margin-top: var(--space-md);
    }
    .btn-group {
      display: flex;
      gap: var(--space-sm);
    }
    .btn-sm {
      background: var(--gray-soft);
      color: var(--brand); /* 改为品牌色，更突出 */
      font-size: 14px;
      font-weight: var(--fw-bold);
      padding: 10px 22px;
      border-radius: var(--radius-btn);
      box-shadow: var(--shadow-flat);
      transition: var(--transition);
    }
    .btn-sm:active {
      background: var(--gray-mid);
    }

    /* 展开区域 */
    .expand-section {
      margin-top: var(--space-lg);
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-sm);
      padding-top: var(--space-lg);
      background: linear-gradient(to right, transparent, var(--gray-border), transparent) 0 0 / 100% 1px no-repeat;
      animation: slideDown 0.2s ease;
    }
    .expand-section.hidden {
      display: none;
    }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .stat-item {
      flex: 1 0 calc(25% - 8px);
      background: var(--gray-soft);
      border-radius: var(--radius-element);
      padding: var(--space-md) var(--space-xs);
      text-align: center;
      box-shadow: var(--shadow-flat);
      transition: var(--transition);
    }
    .stat-item:active {
      background: var(--gray-mid);
    }
    .stat-label {
      font-size: 12px;
      font-weight: var(--fw-regular);
      color: var(--text-tertiary);
      text-transform: uppercase;
      margin-bottom: var(--space-xs);
      letter-spacing: 0.5px;
    }
    .stat-value {
      font-size: 18px;
      font-weight: var(--fw-extrabold);
      background: var(--brand-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* 公告 */
    .announcement {
      display: flex;
      align-items: center;
      gap: var(--space-md);
      color: var(--text-primary);
    }
    .announcement i:first-child {
      color: var(--brand);
      font-size: 22px;
      filter: drop-shadow(0 2px 4px rgba(10,102,224,0.2));
    }
    .announcement span {
      font-weight: var(--fw-bold);
      color: var(--text-primary);
    }

    /* 社区数据网格 */
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-md);
    }
    .community-item {
      background: var(--gray-soft);
      border-radius: var(--radius-element);
      padding: var(--space-lg) var(--space-sm);
      text-align: center;
      box-shadow: var(--shadow-flat);
      transition: var(--transition);
    }
    .community-item:active {
      transform: translateY(-2px);
      box-shadow: var(--shadow-elevated);
      background: white;
    }
    .community-label {
      font-size: 13px;
      font-weight: var(--fw-regular);
      color: var(--text-tertiary);
      text-transform: uppercase;
      margin-bottom: var(--space-xs);
      letter-spacing: 0.5px;
    }
    .community-value {
      font-size: 20px;
      font-weight: var(--fw-extrabold);
      background: var(--brand-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 2px 4px rgba(10,102,224,0.2));
    }

    /* 工具集网格 */
    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--space-lg) var(--space-sm);
      margin-top: var(--space-sm);
    }
    .tool-item {
      background: var(--gray-soft);
      border-radius: var(--radius-element);
      padding: var(--space-lg) var(--space-xs) var(--space-sm);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-xs);
      box-shadow: var(--shadow-flat);
      transition: var(--transition);
    }
    .tool-item:active {
      background: white;
      transform: scale(0.96);
    }
    .tool-item i {
      font-size: 28px;
      background: var(--brand-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 6px 10px rgba(10,102,224,0.3));
    }
    .tool-item span {
      font-size: 11px;
      font-weight: var(--fw-bold);
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    /* 最新活动 */
    .activity-content {
      display: flex;
      align-items: center;
      gap: var(--space-lg);
    }
    .badge-large {
      background: var(--brand-gradient);
      color: white;
      font-weight: var(--fw-bold);
      padding: 8px 22px;
      border-radius: 40px;
      font-size: 14px;
      white-space: nowrap;
      box-shadow: var(--shadow-glow);
      text-shadow: 0 1px 2px rgba(0,0,0,0.1);
    }
    .activity-text {
      font-weight: var(--fw-extrabold);
      font-size: 16px;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: var(--space-xs);
      text-shadow: 0 1px 2px rgba(0,0,0,0.02);
    }
    .activity-text i {
      color: var(--brand);
      filter: drop-shadow(0 2px 4px rgba(10,102,224,0.3));
    }

    /* 便捷双按钮 */
    .quick-row {
      display: flex;
      gap: var(--space-md);
    }
    .quick-btn {
      flex: 1;
      background: linear-gradient(145deg, var(--gray-soft), white); /* 增加立体感 */
      border-radius: var(--radius-btn);
      padding: 16px 0;
      font-size: 16px;
      font-weight: var(--fw-extrabold);
      color: var(--brand);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-sm);
      box-shadow: var(--shadow-flat);
      transition: var(--transition);
      border: 1px solid rgba(10,102,224,0.1);
    }
    .quick-btn:active {
      background: white;
      transform: scale(0.96);
      border-color: var(--brand);
    }
    .quick-btn i {
      color: var(--brand);
      font-size: 18px;
      filter: drop-shadow(0 2px 4px rgba(10,102,224,0.2));
    }

    /* 轮播卡片 */
    .carousel-card {
      background: var(--card);
      border-radius: var(--radius-card);
      padding: var(--space-lg) var(--space-xl);
      box-shadow: var(--shadow-card);
    }
    .carousel-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-md);
    }
    .carousel-text {
      font-size: 17px;
      font-weight: var(--fw-extrabold);
      color: var(--text-primary);
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      text-shadow: 0 1px 2px rgba(0,0,0,0.02);
    }
    .carousel-text i {
      color: var(--brand);
      filter: drop-shadow(0 2px 4px rgba(10,102,224,0.2));
    }
    .carousel-arrow {
      width: 42px;
      height: 42px;
      background: var(--gray-soft);
      border-radius: var(--radius-circle);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--brand);
      font-size: 18px;
      box-shadow: var(--shadow-flat);
      transition: var(--transition);
    }
    .carousel-arrow:active {
      background: white;
      transform: scale(0.92);
      box-shadow: var(--shadow-elevated);
    }
    .carousel-indicators {
      display: flex;
      justify-content: center;
      gap: var(--space-sm);
      margin-top: var(--space-lg);
    }
    .dot {
      width: 8px;
      height: 8px;
      background: var(--gray-icon);
      border-radius: 20px;
      transition: all 0.3s;
    }
    .dot.active {
      background: var(--brand-gradient);
      width: 32px;
      box-shadow: var(--shadow-glow);
    }

    /* 代币方形卡片 */
    .flex-2 {
      display: flex;
      gap: var(--space-lg);
      margin-bottom: var(--space-xs);
    }
    .token-card {
      flex: 1;
      background: var(--card);
      border-radius: var(--radius-card);
      padding: var(--space-xl) var(--space-md) var(--space-lg);
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      transition: var(--transition);
      border: 1px solid rgba(10,102,224,0.05);
    }
    .token-card:active {
      transform: translateY(-6px);
      box-shadow: var(--shadow-elevated);
      border-color: rgba(10,102,224,0.2);
    }
    .token-icon {
      width: 64px;
      height: 64px;
      background: linear-gradient(145deg, #E0EBFF, #C2D9FF);
      border-radius: var(--radius-circle);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: var(--fw-extrabold);
      color: var(--brand);
      margin-bottom: var(--space-md);
      box-shadow: 0 8px 16px rgba(10,102,224,0.15);
    }
    .token-name {
      font-weight: var(--fw-bold);
      font-size: 15px;
      color: var(--text-secondary);
      margin-bottom: var(--space-xs);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .token-price {
      font-size: 28px;
      font-weight: var(--fw-extrabold);
      background: var(--brand-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: var(--space-sm);
      filter: drop-shadow(0 2px 4px rgba(10,102,224,0.2));
    }
    .token-change {
      font-weight: var(--fw-bold);
      font-size: 16px;
      padding: 6px 18px;
      border-radius: 30px;
      background: var(--gray-soft);
      box-shadow: var(--shadow-flat);
      display: inline-block;
    }
    .change-positive {
      background: linear-gradient(145deg, #0F9D58, #1DB954); /* 更饱和的绿 */
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .change-negative {
      background: linear-gradient(145deg, #DB4437, #F06A5A);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* 底部导航栏 */
    .bottom-nav {
      background: var(--card);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: var(--space-sm) var(--space-sm) var(--space-lg);
      box-shadow: 0 -6px 20px rgba(0,20,40,0.06);
      border-top: 1px solid rgba(10,102,224,0.05);
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-xs);
      font-size: 11px;
      font-weight: var(--fw-medium);
      color: var(--gray-text-light);
      padding: var(--space-xs) var(--space-md);
      border-radius: 30px;
      position: relative;
      transition: var(--transition);
    }
    .nav-item i {
      font-size: 22px;
      color: var(--gray-text-light);
      transition: var(--transition);
    }
    .nav-item.active i,
    .nav-item.active .nav-label {
      color: var(--brand);
      font-weight: var(--fw-bold);
      filter: drop-shadow(0 2px 4px rgba(10,102,224,0.2));
    }
    .nav-item.active::after {
      content: '';
      position: absolute;
      bottom: -6px;
      width: 6px;
      height: 6px;
      background: var(--brand-gradient);
      border-radius: 3px;
      box-shadow: var(--shadow-glow);
    }

    /* 辅助类 */
    .mt-1 { margin-top: var(--space-xs); }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <main class="app-main">
    <!-- 1. 用户卡片 -->
    <section class="card" id="userCard">
      <div class="user-header">
        <div class="user-info ripple" id="expandTrigger" role="button" tabindex="0" aria-label="展开个人信息">
          <div class="avatar" aria-hidden="true">H</div>
          <span class="nickname">深海海豚君</span>
          <span class="badge">金牌会员</span>
        </div>
      </div>
      <div class="action-row">
        <div class="btn-group" id="actionButtons">
          <span class="btn-sm ripple" role="button" tabindex="0">充币</span>
          <span class="btn-sm ripple" role="button" tabindex="0">提币</span>
        </div>
      </div>
      <!-- 展开区域 -->
      <div class="expand-section hidden" id="expandContent" aria-expanded="false">
        <div class="stat-item ripple"><div class="stat-label">身价</div><div class="stat-value">12.5k</div></div>
        <div class="stat-item ripple"><div class="stat-label">资产</div><div class="stat-value">5.2k</div></div>
        <div class="stat-item ripple"><div class="stat-label">贡献度</div><div class="stat-value">3.4k</div></div>
        <div class="stat-item ripple"><div class="stat-label">周排名</div><div class="stat-value">#16</div></div>
      </div>
    </section>

    <!-- 2. 公告 -->
    <section class="card">
      <div class="announcement">
        <i class="fas fa-bullhorn"></i>
        <span>111111</span>
        <i class="fas fa-circle" style="font-size: 6px; color: var(--gray-icon); margin-left: auto;" aria-hidden="true"></i>
      </div>
    </section>

    <!-- 3. 社区数据 -->
    <section class="card">
      <div class="card-header">
        <i class="fas fa-chart-pie"></i> 社区数据
      </div>
      <div class="grid-2">
        <div class="community-item ripple">
          <div class="community-label">H总质押</div>
          <div class="community-value">12.5M H</div>
        </div>
        <div class="community-item ripple">
          <div class="community-label">总交易量</div>
          <div class="community-value">$2.3B</div>
        </div>
        <div class="community-item ripple">
          <div class="community-label">国库余额</div>
          <div class="community-value">$1.8M</div>
        </div>

  <script>
    (function() {
      'use strict';
      const expandTrigger = document.getElementById('expandTrigger');
      const expandContent = document.getElementById('expandContent');
      const actionButtons = document.getElementById('actionButtons');

      expandTrigger.addEventListener('click', function(e) {
        e.stopPropagation();
        const isHidden = expandContent.classList.toggle('hidden');
        expandContent.setAttribute('aria-expanded', !isHidden);
      });

      actionButtons.addEventListener('click', function(e) {
        e.stopPropagation();
      });

      expandTrigger.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          this.click();
        }
      });
    })();
  </script>
